<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>

<meta name="theme-color" content="#16211F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#16211F; --bg-2:#101917; --surface:#1E2C2A; --surface-2:#243532;
    --line:#2C3D3A; --ink:#F2EDE4; --muted:#93A29E; --muted-dim:#6E7E7A;
    --ember:#E8B04B; --ember-soft:rgba(232,176,75,.14); --ember-line:rgba(232,176,75,.45);
    --c-reading:#C98A5E; --c-gym:#C9615C; --c-games:#8E7BC4; --c-tasks:#5E9C93; --c-other:#7E8C88;
    --shadow:0 10px 30px rgba(0,0,0,.35); --r:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #1B2A28 0%, var(--bg) 55%, var(--bg-2) 100%) fixed, var(--bg);
    color:var(--ink);
    font-family:"Instrument Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh; line-height:1.45;
  }
  .wrap{
    max-width:560px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 104px);
  }
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand svg{width:22px; height:22px; display:block;}
  .brand .name{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:20px; letter-spacing:.2px;}
  .add-top{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--ember); display:grid; place-items:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .add-top:active{transform:scale(.95);} .add-top svg{width:20px;height:20px;}

  .hero{margin:2px 0 26px;}
  .greeting{color:var(--muted); font-size:14px; margin-bottom:8px; display:flex; gap:8px; align-items:baseline;}
  .greeting .dot{color:var(--muted-dim);}
  .headline{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:clamp(22px,6.2vw,27px); line-height:1.25; color:var(--ink); max-width:24ch;}
  .headline .num{color:var(--ember); font-weight:600;}
  .streakline{margin-top:12px; color:var(--muted); font-size:14px; display:flex; align-items:center; gap:7px;}
  .streakline b{color:var(--ink); font-weight:600;}
  .flame{width:15px;height:15px;display:inline-block;vertical-align:-2px;}

  .list{display:flex; flex-direction:column; gap:12px;}
  .card{
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:15px 15px 15px 18px; display:flex; align-items:center; gap:12px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; overflow:hidden;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tone, var(--c-other)); opacity:.9;}
  .card:active{transform:scale(.992);}
  .card.done{background:linear-gradient(180deg, var(--ember-soft), transparent), var(--surface); border-color:var(--ember-line);}
  .body{flex:1; min-width:0;}
  .titlerow{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .gname{font-size:16.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cat{flex:none; font-size:11px; font-weight:600; letter-spacing:.2px; color:var(--tone, var(--c-other));
    background:color-mix(in srgb, var(--tone, var(--c-other)) 15%, transparent); padding:2px 8px; border-radius:999px;}
  .week{display:flex; gap:6px; align-items:center;}
  .dot{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--line); background:transparent;}
  .dot.on{background:var(--tone, var(--c-other)); border-color:var(--tone, var(--c-other));}
  .dot.today{border-color:var(--muted);}
  .dot.today.on{border-color:var(--tone, var(--c-other)); box-shadow:0 0 0 2px color-mix(in srgb, var(--tone) 25%, transparent);}
  .streak-badge{margin-left:auto; display:none; align-items:center; gap:4px; color:var(--ember); font-size:13px; font-weight:600;}
  .streak-badge.show{display:flex;}
  .timer-btn{
    flex:none; height:38px; padding:0 12px; border-radius:999px; border:1.5px solid var(--line);
    background:transparent; color:var(--muted); display:flex; align-items:center; gap:6px;
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .timer-btn:hover{border-color:var(--muted); color:var(--ink);}
  .timer-btn svg{width:14px;height:14px;}
  .mark{flex:none; width:38px; height:38px; border-radius:50%; border:2px solid var(--line);
    display:grid; place-items:center; color:transparent;
    transition:border-color .18s ease, background .18s ease, transform .18s ease;}
  .mark svg{width:19px;height:19px;}
  .card.done .mark{border-color:var(--ember); background:var(--ember); color:#231a06;}
  .card.done .mark.pulse{animation:pop .42s cubic-bezier(.2,.9,.3,1.3);}
  @keyframes pop{0%{transform:scale(.7);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
  .menu-btn{position:absolute; top:6px; right:6px; width:30px; height:30px; border:0; background:transparent;
    color:var(--muted-dim); font-size:17px; cursor:pointer; border-radius:8px; display:grid; place-items:center;}
  .menu-btn:hover{color:var(--muted); background:var(--surface-2);}

  /* free (abstinence) cards */
  .free-card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; overflow:hidden;}
  .free-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .free-name{font-size:16.5px; font-weight:600;}
  .free-best{color:var(--muted); font-size:12.5px; white-space:nowrap;}
  .free-count{display:flex; align-items:baseline; gap:10px; margin-bottom:4px;}
  .free-days{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:44px; line-height:1; color:var(--ember);}
  .free-dlabel{color:var(--muted); font-size:14px;}
  .free-clock{color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; letter-spacing:.5px; margin-bottom:16px;}
  .bar-label{display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; margin-bottom:7px;}
  .bar{height:8px; border-radius:999px; background:var(--bg-2); overflow:hidden; border:1px solid var(--line);}
  .bar-fill{height:100%; background:linear-gradient(90deg, #C98A5E, var(--ember)); border-radius:999px; transition:width .5s ease;}
  .miles{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
  .mile{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted-dim);}
  .mile.hit{color:#231a06; background:var(--ember); border-color:var(--ember); font-weight:600;}
  .free-actions{display:flex; gap:8px; margin-top:16px;}
  .free-reset{flex:1; border:1px solid var(--line); background:transparent; color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:600; padding:10px; border-radius:11px; cursor:pointer;}
  .free-reset:hover{border-color:var(--ember-line);}
  .free-del{width:44px; border:1px solid var(--line); background:transparent; color:var(--muted-dim);
    font-size:16px; border-radius:11px; cursor:pointer;}
  .free-del:hover{color:var(--c-gym);}

  .empty{text-align:center; padding:30px 8px 8px;}
  .empty h2{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:22px; margin:0 0 8px;}
  .empty p{color:var(--muted); margin:0 auto 22px; max-width:32ch; font-size:14.5px;}
  .starters{display:flex; flex-wrap:wrap; gap:9px; justify-content:center;}
  .starter{border:1px dashed var(--line); background:transparent; color:var(--ink); padding:9px 14px; border-radius:999px;
    font-size:14px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:7px;}
  .starter:hover{border-color:var(--muted); background:var(--surface);}
  .starter .swatch{width:9px;height:9px;border-radius:50%;background:var(--tone, var(--ember));}

  /* bottom tab bar */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:color-mix(in srgb, var(--bg-2) 86%, transparent); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
    display:flex; justify-content:center; gap:10px;
  }
  .tab{
    flex:1; max-width:200px; background:transparent; border:0; cursor:pointer; font-family:inherit;
    color:var(--muted-dim); display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px; border-radius:12px; font-size:11.5px; font-weight:600;
  }
  .tab svg{width:22px;height:22px;}
  .tab.active{color:var(--ember);}
  .tab.active .tabwrap{background:var(--ember-soft);}
  .tabwrap{width:52px; height:30px; border-radius:999px; display:grid; place-items:center; transition:background .15s ease;}

  /* modal sheet */
  .scrim{position:fixed; inset:0; background:rgba(8,13,12,.6); backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center; z-index:60;}
  .scrim.open{display:flex;}
  .sheet{background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0;
    border:1px solid var(--line); border-bottom:0; padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
    animation:rise .24s ease;}
  @keyframes rise{from{transform:translateY(30px); opacity:.6;} to{transform:none; opacity:1;}}
  .sheet h3{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:20px; margin:2px 0 18px;}
  .field{margin-bottom:20px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .field input[type=text]{width:100%; background:var(--bg-2); border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:16px; padding:13px 14px; border-radius:12px; outline:none;}
  .field input[type=text]:focus{border-color:var(--ember-line);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:var(--bg-2); color:var(--ink); padding:9px 13px; border-radius:999px;
    font-size:14px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:7px;}
  .chip .swatch{width:9px;height:9px;border-radius:50%;background:var(--tone, var(--ember));}
  .chip.sel{border-color:var(--tone, var(--ember)); background:color-mix(in srgb, var(--tone, var(--ember)) 16%, var(--bg-2));}
  .actions{display:flex; gap:10px; margin-top:26px;}
  .btn{flex:1; border-radius:12px; padding:14px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--ink);}
  .btn.primary{background:var(--ember); color:#231a06; border-color:var(--ember);}
  .btn.primary:disabled{opacity:.4; cursor:default;}
  .btn:active{transform:scale(.98);}

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px);
    bottom:calc(env(safe-area-inset-bottom) + 92px); background:var(--surface-2); color:var(--ink);
    border:1px solid var(--line); padding:10px 16px; border-radius:999px; font-size:14px; opacity:0;
    pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:70; box-shadow:var(--shadow); text-align:center; max-width:88vw;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .hint{margin-top:28px; text-align:center; color:var(--muted-dim); font-size:12.5px; line-height:1.6;}
  .hint a{color:var(--muted); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;}

  /* focus timer overlay */
  .focus{position:fixed; inset:0; z-index:80; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 10%, #1B2A28, var(--bg) 60%, var(--bg-2)); text-align:center; padding:30px;}
  .focus.open{display:flex;}
  .focus-cat{color:var(--tone, var(--ember)); font-size:12px; font-weight:600; letter-spacing:.3px; margin-bottom:6px;}
  .focus-name{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:24px; margin-bottom:26px; max-width:20ch;}
  .ring-wrap{position:relative; width:260px; height:260px; margin-bottom:8px;}
  .ring{width:100%; height:100%; transform:rotate(0deg);}
  .ring-bg{fill:none; stroke:var(--line); stroke-width:10;}
  .ring-fg{fill:none; stroke:var(--ember); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .3s linear;}
  .ring-time{position:absolute; inset:0; display:grid; place-items:center; font-family:"Fraunces", Georgia, serif;
    font-weight:500; font-size:52px; font-variant-numeric:tabular-nums; letter-spacing:1px;}
  .focus-adjust{display:flex; align-items:center; justify-content:center; gap:10px; margin:22px 0 8px; flex-wrap:wrap;}
  .step{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:22px; cursor:pointer;}
  .presets{display:flex; gap:8px; justify-content:center; margin-bottom:6px; flex-wrap:wrap;}
  .preset{border:1px solid var(--line); background:transparent; color:var(--muted); font-family:inherit; font-size:13px;
    padding:7px 12px; border-radius:999px; cursor:pointer;}
  .preset.sel{border-color:var(--ember); color:var(--ember);}
  .focus-actions{display:flex; gap:12px; justify-content:center; margin-top:20px; width:100%; max-width:320px;}
  .focus-actions .btn{flex:1;}
  .focus-close{margin-top:18px; background:transparent; border:0; color:var(--muted-dim); font-family:inherit;
    font-size:14px; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;}
  .focus-done{font-family:"Fraunces",Georgia,serif; font-size:22px; color:var(--ember); margin-top:20px; display:none;}

  /* gym calendar */
  .gym-stats{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .stat .n{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:26px; color:var(--ember); line-height:1;}
  .stat .l{color:var(--muted); font-size:12.5px; margin-top:4px;}
  .cal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:18px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-title{font-family:"Fraunces",Georgia,serif; font-weight:500; font-size:18px;}
  .cal-nav{display:flex; gap:6px;}
  .cal-nav button{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; font-size:17px; line-height:1;}
  .cal-nav button:hover{border-color:var(--muted);}
  .cal-wd{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-wd span{text-align:center; color:var(--muted-dim); font-size:11px; font-weight:600;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-cell{aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:14px; color:var(--ink); cursor:pointer; border:1px solid transparent; -webkit-tap-highlight-color:transparent;}
  .cal-cell.blank{cursor:default;}
  .cal-cell:not(.blank):active{transform:scale(.94);}
  .cal-cell:not(.blank):hover{background:var(--surface-2);}
  .cal-cell.today{border-color:var(--muted);}
  .cal-cell .cdot{width:6px; height:6px; border-radius:50%; background:transparent;}
  .cal-cell.has{background:var(--ember-soft);}
  .cal-cell.has .cdot{background:var(--ember);}
  .cal-cell.has.today{border-color:var(--ember-line);}
  .recent-title{color:var(--muted); font-size:13px; margin:2px 0 10px;}
  .recent{display:flex; flex-direction:column; gap:8px;}
  .recent-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; cursor:pointer;}
  .recent-row:hover{border-color:var(--muted);}
  .recent-row .rd{color:var(--muted); font-size:12.5px; min-width:78px; flex:none;}
  .recent-row .rt{font-weight:600; font-size:14.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1.4 3 5 4.4 5 8.8a5 5 0 0 1-10 0c0-1.7.7-2.8 1.5-3.7C9 8.5 9.2 7.4 9 6.6c1.2.5 2 1.3 2.4 2.4C11.8 7.4 11.2 4.8 12 2z" fill="#E8B04B"/></svg>
      <span class="name">Ember</span>
    </div>
    <button class="add-top" id="addBtn" aria-label="Add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <section class="hero">
    <div class="greeting"><span id="greeting"></span><span class="dot">·</span><span id="date"></span></div>
    <div class="headline" id="headline"></div>
    <div class="streakline" id="streakline" style="display:none"></div>
  </section>

  <div id="content"></div>

  <p class="hint" id="hint">Runs on your phone. <a id="installHint">Add Ember to your home screen →</a></p>
</div>

<!-- bottom tabs -->
<nav class="tabs">
  <button class="tab active" id="tabToday">
    <span class="tabwrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
    Today
  </button>
  <button class="tab" id="tabGym">
    <span class="tabwrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M4 9.5v5M20 9.5v5M6.5 12h11"/></svg></span>
    Gym
  </button>
  <button class="tab" id="tabFree">
    <span class="tabwrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
    Free
  </button>
</nav>

<!-- add goal / free sheet -->
<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">New goal</h3>

    <div class="field">
      <label id="nameLabel" for="gInput">What do you want to keep up?</label>
      <input type="text" id="gInput" placeholder="Read 20 minutes" autocomplete="off" maxlength="42">
    </div>

    <div class="field" id="catField">
      <label>Category</label>
      <div class="chips" id="chips"></div>
    </div>

    <div class="field" id="timerField">
      <label>Focus timer (optional)</label>
      <div class="chips" id="minChips"></div>
    </div>

    <div class="field" id="sinceField" style="display:none">
      <label>How long has it already been?</label>
      <div class="chips" id="sinceChips"></div>
    </div>

    <div class="actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn" disabled>Add goal</button>
    </div>
  </div>
</div>

<!-- gym day editor sheet -->
<div class="scrim" id="gymScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gymTitle">
    <h3 id="gymTitle">Log workout</h3>
    <div class="field">
      <label id="gymDateLabel" for="gymInput"></label>
      <input type="text" id="gymInput" placeholder="Legs + boxing" autocomplete="off" maxlength="60">
    </div>
    <div class="field"><div class="chips" id="gymChips"></div></div>
    <div class="actions">
      <button class="btn" id="gymClear">Clear day</button>
      <button class="btn primary" id="gymSave">Save</button>
    </div>
  </div>
</div>

<!-- focus timer overlay -->
<div class="focus" id="focus">
  <div class="focus-cat" id="fCat"></div>
  <div class="focus-name" id="fName"></div>
  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 260 260">
      <circle class="ring-bg" cx="130" cy="130" r="116"></circle>
      <circle class="ring-fg" id="ringFg" cx="130" cy="130" r="116" transform="rotate(-90 130 130)"></circle>
    </svg>
    <div class="ring-time" id="fTime">20:00</div>
  </div>

  <div id="fIdle">
    <div class="focus-adjust">
      <button class="step" id="minus" aria-label="Less time">–</button>
      <div class="presets" id="presets"></div>
      <button class="step" id="plus" aria-label="More time">+</button>
    </div>
  </div>

  <div class="focus-actions" id="fActions"></div>
  <div class="focus-done" id="fDone">Kept. Nicely done.</div>
  <button class="focus-close" id="fClose">Close</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var KEY = "ember.v1";
  var CATS = [
    {id:"Reading", tone:"var(--c-reading)"},
    {id:"Gym",     tone:"var(--c-gym)"},
    {id:"Games",   tone:"var(--c-games)"},
    {id:"Tasks",   tone:"var(--c-tasks)"},
    {id:"Other",   tone:"var(--c-other)"}
  ];
  function toneFor(cat){ var c=CATS.find(function(x){return x.id===cat;}); return c?c.tone:"var(--c-other)"; }

  var DAY = 86400000, HOUR = 3600000, MIN = 60000;
  var LADDER = [
    {label:"1 day", ms:1*DAY},{label:"3 days", ms:3*DAY},{label:"1 week", ms:7*DAY},
    {label:"2 weeks", ms:14*DAY},{label:"1 month", ms:30*DAY},{label:"3 months", ms:90*DAY},
    {label:"6 months", ms:180*DAY},{label:"1 year", ms:365*DAY}
  ];

  // ---- state (in-memory truth; persistence best-effort) ----
  var state = { goals:[], logs:{}, free:[] };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){ var p = JSON.parse(raw); if (p && p.goals){ state = p; } }
  } catch(e){}
  if (!Array.isArray(state.free)) state.free = [];   // backward compatible
  if (!state.logs) state.logs = {};
  if (!state.workouts || typeof state.workouts!=="object") state.workouts = {};   // date -> "Legs + boxing"

  var lastSave = 0;
  function save(force){
    var now = Date.now();
    if (!force && now - lastSave < 800) { /* light throttle */ }
    lastSave = now;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }

  // ---- date helpers ----
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function today(){ return ymd(new Date()); }
  function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return ymd(d); }
  function logsFor(id){ return state.logs[id] || (state.logs[id]=[]); }
  function isDone(id,day){ return logsFor(id).indexOf(day)!==-1; }
  function setDoneToday(id,val){
    var arr=logsFor(id), t=today(), i=arr.indexOf(t);
    if (val && i===-1) arr.push(t);
    if (!val && i!==-1) arr.splice(i,1);
    save(true);
  }
  function toggleToday(id){ setDoneToday(id, !isDone(id,today())); }
  function streak(id){
    var done={}; logsFor(id).forEach(function(d){ done[d]=true; });
    var n=0, offset=done[today()]?0:1;
    if (offset===1 && !done[daysAgo(1)]) return 0;
    while (done[daysAgo(offset+n)]) n++;
    return n;
  }
  function doneTodayCount(){ return state.goals.reduce(function(a,g){ return a+(isDone(g.id,today())?1:0); },0); }
  function bestStreak(){ return state.goals.reduce(function(m,g){ return Math.max(m,streak(g.id)); },0); }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function flameSVG(){ return "<svg class='flame' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 2c1.4 3 5 4.4 5 8.8a5 5 0 0 1-10 0c0-1.7.7-2.8 1.5-3.7C9 8.5 9.2 7.4 9 6.6c1.2.5 2 1.3 2.4 2.4C11.8 7.4 11.2 4.8 12 2z' fill='#E8B04B'/></svg>"; }
  function checkSVG(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7'/></svg>"; }
  function dumbSVG(){ return "<svg class='flame' viewBox='0 0 24 24' fill='none' stroke='#E8B04B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 7v10M17.5 7v10M4 9.5v5M20 9.5v5M6.5 12h11'/></svg>"; }
  function clockSVG(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/></svg>"; }

  // ---------------- view state ----------------
  var view = "today";
  var content = document.getElementById("content");

  function greet(){ var h=new Date().getHours(); return h<5?"Late night":h<12?"Good morning":h<18?"Good afternoon":"Good evening"; }

  function renderHero(){
    document.getElementById("greeting").textContent = greet();
    var hl=document.getElementById("headline"), sl=document.getElementById("streakline");
    if (view==="free"){
      var f=state.free.length;
      if (f===0){ hl.textContent="Track time away from what pulls you back."; sl.style.display="none"; return; }
      var longest=state.free.reduce(function(m,x){ return Math.max(m, Date.now()-x.start); },0);
      var d=Math.floor(longest/DAY);
      hl.innerHTML = f===1 ? "One thing you're staying free from." : "<span class='num'>"+f+"</span> things you're staying free from.";
      sl.style.display="flex"; sl.innerHTML = flameSVG()+" Longest run right now: <b>&nbsp;"+d+" day"+(d===1?"":"s")+"</b>";
      return;
    }
    if (view==="gym"){
      var mc=monthCount(new Date().getFullYear(), new Date().getMonth());
      if (mc===0) hl.textContent="No workouts logged this month yet.";
      else hl.innerHTML="<span class='num'>"+mc+"</span> workout"+(mc===1?"":"s")+" this month.";
      var wc=weekCount();
      sl.style.display="flex"; sl.innerHTML = dumbSVG()+" This week: <b>&nbsp;"+wc+"</b>";
      return;
    }
    var g=state.goals.length, done=doneTodayCount();
    if (g===0){ hl.textContent="Tend one small thing each day."; sl.style.display="none"; return; }
    if (done===0) hl.innerHTML="Nothing kept yet today — pick one to start.";
    else if (done===g) hl.innerHTML="Everything kept today. <span class='num'>"+done+"/"+g+"</span>";
    else hl.innerHTML="You've kept <span class='num'>"+done+"</span> of "+g+" today.";
    var best=bestStreak();
    if (best>0){ sl.style.display="flex"; sl.innerHTML=flameSVG()+" Longest active streak: <b>&nbsp;"+best+" day"+(best>1?"s":"")+"</b>"; }
    else sl.style.display="none";
  }

  // ---------------- TODAY view ----------------
  function renderToday(){
    if (state.goals.length===0){ renderEmptyToday(); return; }
    var list=document.createElement("div"); list.className="list";
    state.goals.forEach(function(g){
      var done=isDone(g.id,today()), st=streak(g.id), tone=toneFor(g.category);
      var card=document.createElement("div");
      card.className="card"+(done?" done":"");
      card.style.setProperty("--tone",tone);
      card.setAttribute("role","button"); card.setAttribute("tabindex","0");
      card.setAttribute("aria-pressed", done?"true":"false");
      card.setAttribute("aria-label", g.name+(done?", kept today":", not kept today"));

      var dots="";
      for (var i=6;i>=0;i--){ var day=daysAgo(i); dots+="<span class='dot"+(isDone(g.id,day)?" on":"")+(i===0?" today":"")+"'></span>"; }
      var badge = st>0 ? "<span class='streak-badge show'>"+flameSVG()+st+"</span>" : "<span class='streak-badge'></span>";
      var timerBtn = g.minutes ? "<button class='timer-btn' aria-label='Start focus timer'>"+clockSVG()+g.minutes+"m</button>" : "";

      card.innerHTML =
        "<div class='body'>"+
          "<div class='titlerow'><span class='gname'>"+escapeHtml(g.name)+"</span><span class='cat'>"+g.category+"</span></div>"+
          "<div class='week'>"+dots+badge+"</div>"+
        "</div>"+ timerBtn +
        "<div class='mark'>"+checkSVG()+"</div>"+
        "<button class='menu-btn' aria-label='Delete "+escapeHtml(g.name)+"'>&#215;</button>";

      function tap(){ toggleToday(g.id); renderAndPulse(g.id); }
      card.addEventListener("click", function(e){
        if (e.target.closest(".menu-btn")) return;
        if (e.target.closest(".timer-btn")){ openTimer(g); return; }
        tap();
      });
      card.addEventListener("keydown", function(e){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); tap(); } });
      var mb=card.querySelector(".menu-btn");
      mb.addEventListener("click", function(e){ e.stopPropagation(); confirmDeleteGoal(g); });
      list.appendChild(card);
    });
    content.innerHTML=""; content.appendChild(list);
  }

  var pulseId=null;
  function renderAndPulse(id){
    pulseId=id; renderToday();
    var idx=state.goals.findIndex(function(g){return g.id===id;});
    var cards=content.querySelectorAll(".card");
    if (idx>=0 && cards[idx] && cards[idx].classList.contains("done")){
      var m=cards[idx].querySelector(".mark"); if(m) m.classList.add("pulse");
    }
    pulseId=null;
    renderHero();
  }

  function renderEmptyToday(){
    var wrap=document.createElement("div"); wrap.className="empty";
    wrap.innerHTML="<h2>Start with one thing.</h2><p>Add a goal you want to keep alive, then tap it on each day you do it. Small and steady beats big and rare.</p>";
    var row=document.createElement("div"); row.className="starters";
    [{name:"Read 20 minutes",cat:"Reading",min:20},{name:"Gym",cat:"Gym",min:0},{name:"Deep-work task",cat:"Tasks",min:25},{name:"Play, guilt-free",cat:"Games",min:0}].forEach(function(s){
      var b=document.createElement("button"); b.className="starter"; b.style.setProperty("--tone",toneFor(s.cat));
      b.innerHTML="<span class='swatch'></span>"+s.name;
      b.addEventListener("click", function(){ addGoal(s.name,s.cat,s.min); });
      row.appendChild(b);
    });
    wrap.appendChild(row); content.innerHTML=""; content.appendChild(wrap);
  }

  // ---------------- FREE (abstinence) view ----------------
  var freeRefs = [];   // {item, els...}
  function fmtClock(ms){
    var s=Math.floor(ms/1000);
    var h=Math.floor(s/3600)%24, m=Math.floor(s/60)%60, sec=s%60;
    function p(n){ return String(n).padStart(2,"0"); }
    return p(h)+":"+p(m)+":"+p(sec);
  }
  function milestoneInfo(elapsed){
    var prev=0, next=null;
    for (var i=0;i<LADDER.length;i++){ if (LADDER[i].ms>elapsed){ next=LADDER[i]; break; } prev=LADDER[i].ms; }
    if (!next) return {frac:1, label:"1 year+", done:true};
    var frac=(elapsed-prev)/(next.ms-prev);
    return {frac:Math.max(0,Math.min(1,frac)), label:next.label, done:false, next:next};
  }
  function renderFree(){
    freeRefs=[];
    if (state.free.length===0){ renderEmptyFree(); return; }
    var list=document.createElement("div"); list.className="list";
    state.free.forEach(function(item){
      var el=document.createElement("div"); el.className="free-card";
      el.innerHTML =
        "<div class='free-head'><span class='free-name'>"+escapeHtml(item.name)+"</span><span class='free-best' data-best></span></div>"+
        "<div class='free-count'><span class='free-days' data-days>0</span><span class='free-dlabel' data-dlabel>days free</span></div>"+
        "<div class='free-clock' data-clock>00:00:00</div>"+
        "<div class='bar-label'><span data-nextlabel></span><span data-pct></span></div>"+
        "<div class='bar'><div class='bar-fill' data-fill style='width:0%'></div></div>"+
        "<div class='miles' data-miles></div>"+
        "<div class='free-actions'>"+
          "<button class='free-reset'>I slipped — reset</button>"+
          "<button class='free-del' aria-label='Delete'>&#215;</button>"+
        "</div>";
      el.querySelector(".free-reset").addEventListener("click", function(){ resetFree(item); });
      el.querySelector(".free-del").addEventListener("click", function(){ confirmDeleteFree(item); });
      // milestone chips (static)
      var miles=el.querySelector("[data-miles]");
      miles.innerHTML = LADDER.map(function(l){ return "<span class='mile' data-mms='"+l.ms+"'>"+l.label+"</span>"; }).join("");
      list.appendChild(el);
      freeRefs.push({ item:item, root:el });
    });
    content.innerHTML=""; content.appendChild(list);
    tickFree(); // fill immediately
  }
  function tickFree(){
    var now=Date.now(), changed=false;
    freeRefs.forEach(function(r){
      var elapsed=now - r.item.start;
      if (elapsed<0) elapsed=0;
      if (elapsed > (r.item.best||0)){ r.item.best=elapsed; changed=true; }
      var days=Math.floor(elapsed/DAY);
      var root=r.root;
      root.querySelector("[data-days]").textContent = days;
      root.querySelector("[data-dlabel]").textContent = (days===1?"day free":"days free");
      root.querySelector("[data-clock]").textContent = fmtClock(elapsed);
      var bestDays=Math.floor((r.item.best||0)/DAY);
      root.querySelector("[data-best]").textContent = "Best: "+bestDays+" day"+(bestDays===1?"":"s");
      var mi=milestoneInfo(elapsed);
      root.querySelector("[data-nextlabel]").textContent = mi.done ? "All milestones reached" : ("Next: "+mi.label);
      root.querySelector("[data-pct]").textContent = Math.floor(mi.frac*100)+"%";
      root.querySelector("[data-fill]").style.width = (mi.frac*100)+"%";
      root.querySelectorAll(".mile").forEach(function(chip){
        var mms=+chip.getAttribute("data-mms");
        if (elapsed>=mms) chip.classList.add("hit"); else chip.classList.remove("hit");
      });
    });
    if (changed && Date.now()-lastSave>10000) save(true);
  }
  function renderEmptyFree(){
    var wrap=document.createElement("div"); wrap.className="empty";
    wrap.innerHTML="<h2>Count the time, not the craving.</h2><p>Track how long it's been since you last did something you're cutting back on. The clock keeps running — watch it grow.</p>";
    var row=document.createElement("div"); row.className="starters";
    ["No doomscrolling","No Instagram","No smoking","No vaping"].forEach(function(name){
      var b=document.createElement("button"); b.className="starter";
      b.innerHTML="<span class='swatch'></span>"+name;
      b.addEventListener("click", function(){ addFree(name, 0); });
      row.appendChild(b);
    });
    wrap.appendChild(row); content.innerHTML=""; content.appendChild(wrap);
  }

  function resetFree(item){
    if (confirm('Reset "'+item.name+'" to zero?\n\nYour best run is kept. Slipping is part of it — what matters is starting again.')){
      var elapsed=Date.now()-item.start;
      if (elapsed>(item.best||0)) item.best=elapsed;
      item.start=Date.now(); save(true); renderFree(); renderHero();
      toast("Fresh start. The clock's running again.");
    }
  }
  function confirmDeleteFree(item){
    if (confirm('Delete "'+item.name+'"? This removes its counter and history.')){
      state.free=state.free.filter(function(x){return x.id!==item.id;});
      save(true); renderFree(); renderHero();
    }
  }

  // ---------------- GYM view ----------------
  var gymY=new Date().getFullYear(), gymM=new Date().getMonth();
  function hasWorkout(d){ var v=state.workouts[d]; return !!(v && String(v).trim()); }
  function setWorkout(d,note){ if(note && note.trim()) state.workouts[d]=note.trim(); else delete state.workouts[d]; save(true); }
  function monthCount(y,m){ var pre=y+"-"+String(m+1).padStart(2,"0")+"-"; var n=0; for(var k in state.workouts){ if(k.indexOf(pre)===0 && hasWorkout(k)) n++; } return n; }
  function startOfWeek(){ var d=new Date(); var wd=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-wd); return d; }
  function weekCount(){ var s=startOfWeek(), n=0; for(var i=0;i<7;i++){ var dd=new Date(s); dd.setDate(s.getDate()+i); if(hasWorkout(ymd(dd))) n++; } return n; }

  function renderGym(){
    var el=document.createElement("div");
    var mc=monthCount(new Date().getFullYear(), new Date().getMonth()), wc=weekCount();
    var stats="<div class='gym-stats'>"+
      "<div class='stat'><div class='n'>"+mc+"</div><div class='l'>this month</div></div>"+
      "<div class='stat'><div class='n'>"+wc+"</div><div class='l'>this week</div></div></div>";

    var monthName=new Date(gymY,gymM,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
    var first=new Date(gymY,gymM,1);
    var startWd=(first.getDay()+6)%7;               // Mon=0
    var dim=new Date(gymY,gymM+1,0).getDate();
    var wdRow=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(w){return "<span>"+w+"</span>";}).join("");
    var t=today(), cells="";
    for(var b=0;b<startWd;b++) cells+="<div class='cal-cell blank'></div>";
    for(var day=1; day<=dim; day++){
      var ds=ymd(new Date(gymY,gymM,day));
      var cls="cal-cell"+(hasWorkout(ds)?" has":"")+(ds===t?" today":"");
      cells+="<div class='"+cls+"' data-d='"+ds+"'><span class='cd'>"+day+"</span><span class='cdot'></span></div>";
    }
    var cal="<div class='cal'><div class='cal-head'><div class='cal-title'>"+monthName+"</div>"+
      "<div class='cal-nav'><button data-nav='-1' aria-label='Previous month'>&#8249;</button>"+
      "<button data-nav='1' aria-label='Next month'>&#8250;</button></div></div>"+
      "<div class='cal-wd'>"+wdRow+"</div><div class='cal-grid'>"+cells+"</div></div>";

    var entries=Object.keys(state.workouts).filter(hasWorkout).sort().reverse().slice(0,5);
    var recent;
    if(entries.length){
      recent="<p class='recent-title'>Recent sessions</p><div class='recent'>"+entries.map(function(d){
        var dd=new Date(d+"T00:00:00");
        var lab=dd.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
        return "<div class='recent-row' data-d='"+d+"'><span class='rd'>"+lab+"</span><span class='rt'>"+escapeHtml(state.workouts[d])+"</span></div>";
      }).join("")+"</div>";
    } else {
      recent="<p class='recent-title'>Tap any day to log what you trained.</p>";
    }

    el.innerHTML=stats+cal+recent;
    content.innerHTML=""; content.appendChild(el);
    el.querySelectorAll(".cal-cell[data-d]").forEach(function(c){ c.addEventListener("click", function(){ openGymEditor(c.getAttribute("data-d")); }); });
    el.querySelectorAll(".cal-nav button").forEach(function(bt){ bt.addEventListener("click", function(){
      gymM+=parseInt(bt.getAttribute("data-nav"),10);
      if(gymM<0){gymM=11;gymY--;} if(gymM>11){gymM=0;gymY++;} renderGym();
    }); });
    el.querySelectorAll(".recent-row").forEach(function(r){ r.addEventListener("click", function(){ openGymEditor(r.getAttribute("data-d")); }); });
  }

  var gymScrim=document.getElementById("gymScrim");
  var gymInput=document.getElementById("gymInput");
  var gymEditDate=null;
  function buildGymChips(){
    var box=document.getElementById("gymChips");
    var opts=["Legs","Push","Pull","Chest","Back","Arms","Core","Boxing","Cardio","Run"];
    box.innerHTML="";
    opts.forEach(function(o){
      var bb=document.createElement("button"); bb.className="chip"; bb.style.setProperty("--tone","var(--c-gym)"); bb.textContent=o;
      bb.addEventListener("click", function(){ var v=gymInput.value.trim(); gymInput.value = v ? (v+" + "+o) : o; gymInput.focus(); });
      box.appendChild(bb);
    });
  }
  function openGymEditor(d){
    gymEditDate=d;
    var dd=new Date(d+"T00:00:00");
    document.getElementById("gymDateLabel").textContent=dd.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
    gymInput.value=state.workouts[d]||"";
    document.getElementById("gymClear").style.display=hasWorkout(d)?"":"none";
    buildGymChips();
    gymScrim.classList.add("open");
    setTimeout(function(){ gymInput.focus(); },60);
  }
  function closeGym(){ gymScrim.classList.remove("open"); }
  document.getElementById("gymSave").addEventListener("click", function(){
    var val=gymInput.value; setWorkout(gymEditDate, val); closeGym();
    if(view==="gym") renderGym(); renderHero();
    toast(val.trim() ? "Workout logged" : "Day cleared");
  });
  document.getElementById("gymClear").addEventListener("click", function(){
    setWorkout(gymEditDate,""); closeGym(); if(view==="gym") renderGym(); renderHero(); toast("Day cleared");
  });
  gymInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("gymSave").click(); } });
  gymScrim.addEventListener("click", function(e){ if(e.target===gymScrim) closeGym(); });

  // ---------------- add flows ----------------
  var scrim=document.getElementById("scrim");
  var gInput=document.getElementById("gInput");
  var saveBtn=document.getElementById("saveBtn");
  var chipsBox=document.getElementById("chips");
  var minChips=document.getElementById("minChips");
  var sinceChips=document.getElementById("sinceChips");
  var pickedCat="Reading", pickedMin=0, pickedSince=0, addMode="goal";

  function buildCatChips(){
    chipsBox.innerHTML="";
    CATS.forEach(function(c){
      var b=document.createElement("button"); b.className="chip"+(c.id===pickedCat?" sel":"");
      b.style.setProperty("--tone",c.tone); b.innerHTML="<span class='swatch'></span>"+c.id;
      b.addEventListener("click", function(){ pickedCat=c.id; buildCatChips(); });
      chipsBox.appendChild(b);
    });
  }
  function buildMinChips(){
    var opts=[{l:"None",v:0},{l:"10 min",v:10},{l:"20 min",v:20},{l:"30 min",v:30},{l:"45 min",v:45}];
    minChips.innerHTML="";
    opts.forEach(function(o){
      var b=document.createElement("button"); b.className="chip"+(o.v===pickedMin?" sel":"");
      b.style.setProperty("--tone","var(--ember)"); b.textContent=o.l;
      b.addEventListener("click", function(){ pickedMin=o.v; buildMinChips(); });
      minChips.appendChild(b);
    });
  }
  function buildSinceChips(){
    var opts=[{l:"Just now",v:0},{l:"1 day",v:1*DAY},{l:"3 days",v:3*DAY},{l:"1 week",v:7*DAY},{l:"1 month",v:30*DAY}];
    sinceChips.innerHTML="";
    opts.forEach(function(o){
      var b=document.createElement("button"); b.className="chip"+(o.v===pickedSince?" sel":"");
      b.style.setProperty("--tone","var(--ember)"); b.textContent=o.l;
      b.addEventListener("click", function(){ pickedSince=o.v; buildSinceChips(); });
      sinceChips.appendChild(b);
    });
  }

  function openSheet(){
    addMode = (view==="free") ? "free" : "goal";
    gInput.value=""; saveBtn.disabled=true;
    if (addMode==="goal"){
      document.getElementById("sheetTitle").textContent="New goal";
      document.getElementById("nameLabel").textContent="What do you want to keep up?";
      gInput.placeholder="Read 20 minutes";
      document.getElementById("catField").style.display="";
      document.getElementById("timerField").style.display="";
      document.getElementById("sinceField").style.display="none";
      saveBtn.textContent="Add goal";
      pickedCat="Reading"; pickedMin=0; buildCatChips(); buildMinChips();
    } else {
      document.getElementById("sheetTitle").textContent="New counter";
      document.getElementById("nameLabel").textContent="What are you staying free from?";
      gInput.placeholder="No doomscrolling";
      document.getElementById("catField").style.display="none";
      document.getElementById("timerField").style.display="none";
      document.getElementById("sinceField").style.display="";
      saveBtn.textContent="Start counter";
      pickedSince=0; buildSinceChips();
    }
    scrim.classList.add("open");
    setTimeout(function(){ gInput.focus(); },60);
  }
  function closeSheet(){ scrim.classList.remove("open"); }

  gInput.addEventListener("input", function(){ saveBtn.disabled = gInput.value.trim().length===0; });
  gInput.addEventListener("keydown", function(e){ if(e.key==="Enter" && gInput.value.trim()) commit(); });

  function commit(){
    var name=gInput.value.trim(); if(!name) return;
    if (addMode==="goal") addGoal(name, pickedCat, pickedMin);
    else addFree(name, pickedSince);
    closeSheet();
  }
  function addGoal(name,cat,min){
    state.goals.push({ id:"g"+Date.now()+Math.floor(Math.random()*999), name:name, category:cat, minutes:min||0 });
    save(true); if(view==="today") renderToday(); renderHero();
    toast(min ? "Added — tap the timer or log it each day" : "Added — tap it each day you do it");
  }
  function addFree(name,sinceMs){
    var start=Date.now()-(sinceMs||0);
    state.free.push({ id:"f"+Date.now()+Math.floor(Math.random()*999), name:name, start:start, best:sinceMs||0 });
    save(true); if(view==="free") renderFree(); renderHero();
    toast("Counter started. Keep it going.");
  }
  function confirmDeleteGoal(g){
    if (confirm('Delete "'+g.name+'"? Your logged days for it will be removed.')){
      state.goals=state.goals.filter(function(x){return x.id!==g.id;});
      delete state.logs[g.id]; save(true); renderToday(); renderHero();
    }
  }

  document.getElementById("addBtn").addEventListener("click", function(){ if(view==="gym") openGymEditor(today()); else openSheet(); });
  document.getElementById("cancelBtn").addEventListener("click", closeSheet);
  saveBtn.addEventListener("click", commit);
  scrim.addEventListener("click", function(e){ if(e.target===scrim) closeSheet(); });

  // ---------------- focus timer ----------------
  var focus=document.getElementById("focus");
  var ringFg=document.getElementById("ringFg");
  var R=116, C=2*Math.PI*R;
  ringFg.style.strokeDasharray=C;
  ringFg.style.strokeDashoffset=C;
  var T={ goal:null, totalMs:0, endAt:0, remaining:0, mode:"idle", iv:null, actx:null, wake:null, minutes:20 };

  function fmtTimer(ms){
    var s=Math.max(0,Math.round(ms/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    function p(n){return String(n).padStart(2,"0");}
    return h>0 ? h+":"+p(m)+":"+p(sec) : m+":"+p(sec);
  }
  function setRing(frac){ ringFg.style.strokeDashoffset = C*(1-Math.max(0,Math.min(1,frac))); }

  function buildPresets(){
    var box=document.getElementById("presets"); var opts=[10,20,30,45];
    box.innerHTML="";
    opts.forEach(function(v){
      var b=document.createElement("button"); b.className="preset"+(v===T.minutes?" sel":"");
      b.textContent=v+"m"; b.addEventListener("click", function(){ T.minutes=v; refreshIdle(); });
      box.appendChild(b);
    });
  }
  function refreshIdle(){
    if (T.minutes<1) T.minutes=1; if (T.minutes>180) T.minutes=180;
    document.getElementById("fTime").textContent = fmtTimer(T.minutes*MIN);
    setRing(0); buildPresets();
  }
  function renderActions(){
    var box=document.getElementById("fActions"); box.innerHTML="";
    var idle=document.getElementById("fIdle");
    var done=document.getElementById("fDone");
    done.style.display = (T.mode==="done") ? "block":"none";
    idle.style.display = (T.mode==="idle") ? "block":"none";
    if (T.mode==="idle"){
      var start=btn("Start","primary",function(){ startTimer(); });
      box.appendChild(start);
    } else if (T.mode==="running"){
      box.appendChild(btn("Pause","",function(){ pauseTimer(); }));
      box.appendChild(btn("End","",function(){ endTimer(false); }));
    } else if (T.mode==="paused"){
      box.appendChild(btn("Resume","primary",function(){ resumeTimer(); }));
      box.appendChild(btn("End","",function(){ endTimer(false); }));
    } else if (T.mode==="done"){
      box.appendChild(btn("Done","primary",function(){ closeTimer(); }));
    }
  }
  function btn(label,cls,fn){ var b=document.createElement("button"); b.className="btn"+(cls?" "+cls:""); b.textContent=label; b.addEventListener("click",fn); return b; }

  function openTimer(goal){
    T.goal=goal; T.mode="idle"; T.minutes=goal.minutes||20;
    document.getElementById("fCat").textContent=goal.category;
    document.getElementById("fCat").style.setProperty("--tone",toneFor(goal.category));
    document.getElementById("fName").textContent=goal.name;
    focus.style.setProperty("--tone",toneFor(goal.category));
    refreshIdle(); renderActions();
    focus.classList.add("open");
  }
  function ensureAudio(){ try{ if(!T.actx){ T.actx=new (window.AudioContext||window.webkitAudioContext)(); } if(T.actx.state==="suspended") T.actx.resume(); }catch(e){} }
  function beep(){
    try{
      if(!T.actx) return;
      var o=T.actx.createOscillator(), g=T.actx.createGain();
      o.connect(g); g.connect(T.actx.destination);
      o.type="sine"; o.frequency.value=660; g.gain.value=0.001;
      var t=T.actx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.25, t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.9);
      o.start(t); o.stop(t+0.95);
    }catch(e){}
  }
  function acquireWake(){ try{ if(navigator.wakeLock){ navigator.wakeLock.request("screen").then(function(w){ T.wake=w; }).catch(function(){}); } }catch(e){} }
  function releaseWake(){ try{ if(T.wake){ T.wake.release(); T.wake=null; } }catch(e){} }

  function startTimer(){
    ensureAudio(); acquireWake();
    T.totalMs=T.minutes*MIN; T.endAt=Date.now()+T.totalMs; T.mode="running";
    renderActions(); loop();
    if (T.iv) clearInterval(T.iv);
    T.iv=setInterval(loop,250);
  }
  function loop(){
    if (T.mode!=="running") return;
    var remaining=T.endAt-Date.now();
    if (remaining<=0){ remaining=0; finishTimer(); }
    document.getElementById("fTime").textContent=fmtTimer(remaining);
    setRing((T.totalMs-remaining)/T.totalMs);
  }
  function pauseTimer(){ if(T.mode!=="running")return; T.remaining=T.endAt-Date.now(); T.mode="paused"; if(T.iv){clearInterval(T.iv);T.iv=null;} renderActions(); releaseWake(); }
  function resumeTimer(){ if(T.mode!=="paused")return; T.endAt=Date.now()+T.remaining; T.mode="running"; acquireWake(); renderActions(); T.iv=setInterval(loop,250); }
  function endTimer(){ if(T.iv){clearInterval(T.iv);T.iv=null;} releaseWake(); closeTimer(); }
  function finishTimer(){
    if(T.iv){clearInterval(T.iv);T.iv=null;}
    T.mode="done"; setRing(1);
    document.getElementById("fTime").textContent=fmtTimer(0);
    releaseWake(); beep();
    try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
    if (T.goal && !isDone(T.goal.id,today())) setDoneToday(T.goal.id,true);
    renderActions();
  }
  function closeTimer(){
    if(T.iv){clearInterval(T.iv);T.iv=null;}
    releaseWake(); focus.classList.remove("open"); T.mode="idle";
    if(view==="today"){ renderToday(); renderHero(); }
  }
  document.getElementById("minus").addEventListener("click", function(){ if(T.mode==="idle"){ T.minutes-=5; refreshIdle(); } });
  document.getElementById("plus").addEventListener("click", function(){ if(T.mode==="idle"){ T.minutes+=5; refreshIdle(); } });
  document.getElementById("fClose").addEventListener("click", function(){
    if (T.mode==="running"||T.mode==="paused"){ if(!confirm("End this session? It won't be logged.")) return; }
    endTimer();
  });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && T.mode==="running"){ acquireWake(); loop(); } });

  // ---------------- tabs ----------------
  function setView(v){
    view=v;
    document.getElementById("tabToday").classList.toggle("active", v==="today");
    document.getElementById("tabGym").classList.toggle("active", v==="gym");
    document.getElementById("tabFree").classList.toggle("active", v==="free");
    document.getElementById("hint").style.display = (v==="today") ? "" : "none";
    render();
  }
  document.getElementById("tabToday").addEventListener("click", function(){ setView("today"); });
  document.getElementById("tabGym").addEventListener("click", function(){ setView("gym"); });
  document.getElementById("tabFree").addEventListener("click", function(){ setView("free"); });

  function render(){ renderHero(); if(view==="today") renderToday(); else if(view==="gym") renderGym(); else renderFree(); }

  // ---------------- toast ----------------
  var toastEl=document.getElementById("toast"), toastT=null;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove("show"); },2100); }

  // ---------------- date + global tick ----------------
  var curDay=today();
  (function(){ var d=new Date(); document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); })();
  setInterval(function(){
    if (view==="free") tickFree();
    var t=today();
    if (t!==curDay){ curDay=t; if(view==="today"){ renderToday(); renderHero(); } }
  }, 1000);
  window.addEventListener("pagehide", function(){ save(true); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) save(true); });

  // ---------------- install hint ----------------
  document.getElementById("installHint").addEventListener("click", function(){
    var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    alert(iOS
      ? "On iPhone (Safari):\n\n1. Tap the Share button (square with an up-arrow).\n2. Scroll down and tap \"Add to Home Screen\".\n3. Tap Add.\n\nEmber opens fullscreen and keeps your data."
      : "On Android (Chrome):\n\n1. Tap the \u22ee menu (top-right).\n2. Tap \"Add to Home screen\" (or \"Install app\").\n3. Confirm.\n\nEmber opens fullscreen and keeps your data.");
  });

  // ---------------- runtime manifest + icon ----------------
  try{
    var icon="data:image/svg+xml;utf8,"+encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'>"+
      "<rect width='512' height='512' rx='112' fill='#16211F'/>"+
      "<path d='M256 96c30 64 108 94 108 188a108 108 0 0 1-216 0c0-36 15-60 32-79 6 30 10 54 6 71 26-12 43-28 51-52 4 30-4 78 19 0z' fill='#E8B04B'/></svg>");
    var manifest={ name:"Ember", short_name:"Ember", display:"standalone", background_color:"#16211F", theme_color:"#16211F",
      icons:[{ src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable" }] };
    var link=document.createElement("link"); link.rel="manifest";
    link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
    document.head.appendChild(link);
    var apple=document.createElement("link"); apple.rel="apple-touch-icon"; apple.href=icon; document.head.appendChild(apple);
  }catch(e){}

  render();
})();
</script>
</body>
</html>
