<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>

<!-- Add-to-home-screen / standalone app hints -->
<meta name="theme-color" content="#16211F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#16211F;
    --bg-2:#101917;
    --surface:#1E2C2A;
    --surface-2:#243532;
    --line:#2C3D3A;
    --ink:#F2EDE4;
    --muted:#93A29E;
    --muted-dim:#6E7E7A;
    --ember:#E8B04B;
    --ember-soft:rgba(232,176,75,.14);
    --ember-line:rgba(232,176,75,.45);
    /* category tones — muted, earthy, never neon */
    --c-reading:#C98A5E;
    --c-gym:#C9615C;
    --c-games:#8E7BC4;
    --c-tasks:#5E9C93;
    --c-other:#7E8C88;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --r:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #1B2A28 0%, var(--bg) 55%, var(--bg-2) 100%) fixed,
      var(--bg);
    color:var(--ink);
    font-family:"Instrument Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    line-height:1.45;
  }

  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:
      calc(env(safe-area-inset-top) + 22px)
      20px
      calc(env(safe-area-inset-bottom) + 120px);
  }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px;
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand svg{width:22px; height:22px; display:block;}
  .brand .name{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600; font-size:20px; letter-spacing:.2px;
  }
  .date{color:var(--muted); font-size:13.5px;}

  /* ---------- hero ---------- */
  .hero{margin:2px 0 30px;}
  .greeting{color:var(--muted); font-size:15px; margin-bottom:8px;}
  .headline{
    font-family:"Fraunces", Georgia, serif;
    font-weight:500;
    font-size:clamp(23px, 6.4vw, 28px);
    line-height:1.25;
    letter-spacing:.1px;
    color:var(--ink);
    max-width:22ch;
  }
  .headline .num{ color:var(--ember); font-weight:600; }
  .streakline{
    margin-top:12px; color:var(--muted); font-size:14px;
    display:flex; align-items:center; gap:7px;
  }
  .streakline b{color:var(--ink); font-weight:600;}
  .flame{width:15px;height:15px;display:inline-block;vertical-align:-2px;}

  /* ---------- goal list ---------- */
  .list{display:flex; flex-direction:column; gap:12px;}

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:15px 15px 15px 18px;
    display:flex; align-items:center; gap:14px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
    overflow:hidden;
  }
  .card::before{ /* category edge */
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--tone, var(--c-other));
    opacity:.9;
  }
  .card:active{ transform:scale(.992); }
  .card.done{
    background:linear-gradient(180deg, var(--ember-soft), transparent), var(--surface);
    border-color:var(--ember-line);
  }

  .body{flex:1; min-width:0;}
  .titlerow{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .gname{
    font-size:16.5px; font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cat{
    flex:none;
    font-size:11px; font-weight:600; letter-spacing:.2px;
    color:var(--tone, var(--c-other));
    background:color-mix(in srgb, var(--tone, var(--c-other)) 15%, transparent);
    padding:2px 8px; border-radius:999px;
  }

  /* week strip */
  .week{display:flex; gap:6px; align-items:center;}
  .dot{
    width:11px; height:11px; border-radius:50%;
    border:1.5px solid var(--line);
    background:transparent;
  }
  .dot.on{ background:var(--tone, var(--c-other)); border-color:var(--tone, var(--c-other)); }
  .dot.today{ border-color:var(--muted); }
  .dot.today.on{ border-color:var(--tone, var(--c-other)); box-shadow:0 0 0 2px color-mix(in srgb, var(--tone) 25%, transparent); }
  .streak-badge{
    margin-left:auto; display:none; align-items:center; gap:4px;
    color:var(--ember); font-size:13px; font-weight:600;
  }
  .streak-badge.show{display:flex;}

  /* the check / tap target */
  .mark{
    flex:none; width:38px; height:38px; border-radius:50%;
    border:2px solid var(--line);
    display:grid; place-items:center;
    transition:border-color .18s ease, background .18s ease, transform .18s ease;
    color:transparent;
  }
  .mark svg{width:19px;height:19px;}
  .card.done .mark{
    border-color:var(--ember);
    background:var(--ember);
    color:#231a06;
  }
  .card.done .mark.pulse{ animation:pop .42s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{
    0%{transform:scale(.7);}
    55%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }

  .menu-btn{
    position:absolute; top:6px; right:6px;
    width:30px; height:30px; border:0; background:transparent;
    color:var(--muted-dim); font-size:17px; cursor:pointer; border-radius:8px;
    display:grid; place-items:center;
  }
  .menu-btn:hover{color:var(--muted); background:var(--surface-2);}

  /* ---------- empty state ---------- */
  .empty{
    text-align:center; padding:34px 8px 8px;
  }
  .empty h2{
    font-family:"Fraunces", Georgia, serif; font-weight:500;
    font-size:22px; margin:0 0 8px;
  }
  .empty p{color:var(--muted); margin:0 auto 22px; max-width:32ch; font-size:14.5px;}
  .starters{display:flex; flex-wrap:wrap; gap:9px; justify-content:center;}
  .starter{
    border:1px dashed var(--line); background:transparent; color:var(--ink);
    padding:9px 14px; border-radius:999px; font-size:14px; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; gap:7px;
    transition:border-color .15s ease, background .15s ease;
  }
  .starter:hover{border-color:var(--muted); background:var(--surface);}
  .starter .swatch{width:9px;height:9px;border-radius:50%;background:var(--tone);}

  /* ---------- add button (fab) ---------- */
  .fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 22px);
    background:var(--ember); color:#231a06;
    border:0; border-radius:999px; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:15.5px;
    padding:14px 22px; display:flex; align-items:center; gap:9px;
    box-shadow:var(--shadow), 0 0 0 6px rgba(232,176,75,.08);
  }
  .fab:active{transform:translateX(-50%) scale(.97);}
  .fab svg{width:18px;height:18px;}

  /* ---------- modal ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(8,13,12,.6);
    backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .scrim.open{display:flex;}
  .sheet{
    background:var(--surface); width:100%; max-width:560px;
    border-radius:22px 22px 0 0;
    border:1px solid var(--line); border-bottom:0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
    animation:rise .24s ease;
  }
  @keyframes rise{from{transform:translateY(30px); opacity:.6;} to{transform:none; opacity:1;}}
  .sheet h3{
    font-family:"Fraunces", Georgia, serif; font-weight:500;
    font-size:20px; margin:2px 0 18px;
  }
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .field input[type=text]{
    width:100%; background:var(--bg-2); border:1px solid var(--line);
    color:var(--ink); font-family:inherit; font-size:16px;
    padding:13px 14px; border-radius:12px; outline:none;
  }
  .field input[type=text]:focus{border-color:var(--ember-line);}
  .field{margin-bottom:20px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--line); background:var(--bg-2); color:var(--ink);
    padding:9px 13px; border-radius:999px; font-size:14px; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; gap:7px;
    transition:border-color .15s ease, background .15s ease;
  }
  .chip .swatch{width:9px;height:9px;border-radius:50%;background:var(--tone);}
  .chip.sel{ border-color:var(--tone); background:color-mix(in srgb, var(--tone) 16%, var(--bg-2)); }
  .actions{display:flex; gap:10px; margin-top:26px;}
  .btn{
    flex:1; border-radius:12px; padding:14px; font-family:inherit;
    font-size:15px; font-weight:600; cursor:pointer; border:1px solid var(--line);
    background:transparent; color:var(--ink);
  }
  .btn.primary{ background:var(--ember); color:#231a06; border-color:var(--ember); }
  .btn.primary:disabled{opacity:.4; cursor:default;}
  .btn:active{transform:scale(.98);}

  /* tiny toast */
  .toast{
    position:fixed; left:50%; transform:translateX(-50%) translateY(20px);
    bottom:calc(env(safe-area-inset-bottom) + 92px);
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
    padding:10px 16px; border-radius:999px; font-size:14px;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:60; box-shadow:var(--shadow);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* footer hint */
  .hint{
    margin-top:30px; text-align:center; color:var(--muted-dim); font-size:12.5px;
    line-height:1.6;
  }
  .hint a{color:var(--muted); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1.4 3 5 4.4 5 8.8a5 5 0 0 1-10 0c0-1.7.7-2.8 1.5-3.7C9 8.5 9.2 7.4 9 6.6c1.2.5 2 1.3 2.4 2.4C11.8 7.4 11.2 4.8 12 2z" fill="#E8B04B"/></svg>
      <span class="name">Ember</span>
    </div>
    <div class="date" id="date"></div>
  </header>

  <section class="hero">
    <div class="greeting" id="greeting"></div>
    <div class="headline" id="headline"></div>
    <div class="streakline" id="streakline" style="display:none"></div>
  </section>

  <div id="content"></div>

  <p class="hint">
    Runs offline. <a id="installHint">Add Ember to your home screen →</a>
  </p>
</div>

<button class="fab" id="addBtn" aria-label="Add a goal">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  New goal
</button>

<!-- add / edit sheet -->
<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">New goal</h3>
    <div class="field">
      <label for="gInput">What do you want to keep up?</label>
      <input type="text" id="gInput" placeholder="Read 20 minutes" autocomplete="off" maxlength="42">
    </div>
    <div class="field">
      <label>Category</label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn" disabled>Add goal</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var KEY = "ember.v1";
  var CATS = [
    {id:"Reading", tone:"var(--c-reading)"},
    {id:"Gym",     tone:"var(--c-gym)"},
    {id:"Games",   tone:"var(--c-games)"},
    {id:"Tasks",   tone:"var(--c-tasks)"},
    {id:"Other",   tone:"var(--c-other)"}
  ];
  function toneFor(cat){ var c = CATS.find(function(x){return x.id===cat;}); return c ? c.tone : "var(--c-other)"; }

  /* ---- state (source of truth in memory; persistence is best-effort) ---- */
  var state = { goals: [], logs: {} };   // logs: { goalId: ["YYYY-MM-DD", ...] }
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && p.goals) state = p; }
  } catch(e){ /* sandboxed or blocked — run in memory */ }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ /* best effort */ }
  }

  /* ---- date helpers (local time) ---- */
  function ymd(d){
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  }
  function today(){ return ymd(new Date()); }
  function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return ymd(d); }

  function logsFor(id){ return state.logs[id] || (state.logs[id]=[]); }
  function isDone(id, day){ return logsFor(id).indexOf(day) !== -1; }

  function toggleToday(id){
    var arr = logsFor(id), t = today(), i = arr.indexOf(t);
    if (i === -1) arr.push(t); else arr.splice(i,1);
    save();
  }

  // streak counts consecutive days ending today; if today isn't done yet,
  // yesterday's run still counts (kinder — you have until midnight).
  function streak(id){
    var done = {}; logsFor(id).forEach(function(d){ done[d]=true; });
    var n = 0, offset = done[today()] ? 0 : 1;
    if (offset === 1 && !done[daysAgo(1)]) return 0;
    while (done[daysAgo(offset+n)]) n++;
    return n;
  }

  function doneTodayCount(){
    return state.goals.reduce(function(a,g){ return a + (isDone(g.id, today())?1:0); }, 0);
  }
  function bestStreak(){
    return state.goals.reduce(function(m,g){ return Math.max(m, streak(g.id)); }, 0);
  }

  /* ---- rendering ---- */
  var content = document.getElementById("content");

  function greet(){
    var h = new Date().getHours();
    if (h < 5)  return "Late night";
    if (h < 12) return "Good morning";
    if (h < 18) return "Good afternoon";
    return "Good evening";
  }

  function renderHero(){
    document.getElementById("greeting").textContent = greet();
    var g = state.goals.length, done = doneTodayCount();
    var hl = document.getElementById("headline");
    var sl = document.getElementById("streakline");

    if (g === 0){
      hl.textContent = "Tend one small thing each day.";
      sl.style.display = "none";
      return;
    }
    if (done === 0){
      hl.innerHTML = "Nothing kept yet today — pick one to start.";
    } else if (done === g){
      hl.innerHTML = "Everything kept today. <span class='num'>"+done+"/"+g+"</span>";
    } else {
      hl.innerHTML = "You've kept <span class='num'>"+done+"</span> of "+g+" today.";
    }

    var best = bestStreak();
    if (best > 0){
      sl.style.display = "flex";
      sl.innerHTML = flameSVG() + " Longest active streak: <b>&nbsp;"+best+" day"+(best>1?"s":"")+"</b>";
    } else {
      sl.style.display = "none";
    }
  }

  function flameSVG(){
    return "<svg class='flame' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 2c1.4 3 5 4.4 5 8.8a5 5 0 0 1-10 0c0-1.7.7-2.8 1.5-3.7C9 8.5 9.2 7.4 9 6.6c1.2.5 2 1.3 2.4 2.4C11.8 7.4 11.2 4.8 12 2z' fill='#E8B04B'/></svg>";
  }
  function checkSVG(){
    return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7'/></svg>";
  }

  function render(){
    renderHero();
    if (state.goals.length === 0){ renderEmpty(); return; }

    var list = document.createElement("div");
    list.className = "list";

    state.goals.forEach(function(g){
      var done = isDone(g.id, today());
      var st = streak(g.id);
      var tone = toneFor(g.category);

      var card = document.createElement("div");
      card.className = "card" + (done ? " done" : "");
      card.style.setProperty("--tone", tone);
      card.setAttribute("role","button");
      card.setAttribute("tabindex","0");
      card.setAttribute("aria-pressed", done ? "true":"false");
      card.setAttribute("aria-label", g.name + (done?", kept today":", not kept today"));

      // week dots (6 days ago -> today)
      var dots = "";
      for (var i=6;i>=0;i--){
        var day = daysAgo(i);
        var on = isDone(g.id, day) ? " on" : "";
        var td = (i===0) ? " today" : "";
        dots += "<span class='dot"+on+td+"'></span>";
      }
      var badge = st>0 ? "<span class='streak-badge show'>"+flameSVG()+st+"</span>"
                       : "<span class='streak-badge'></span>";

      card.innerHTML =
        "<div class='body'>"+
          "<div class='titlerow'>"+
            "<span class='gname'>"+escapeHtml(g.name)+"</span>"+
            "<span class='cat'>"+g.category+"</span>"+
          "</div>"+
          "<div class='week'>"+dots+badge+"</div>"+
        "</div>"+
        "<div class='mark'>"+checkSVG()+"</div>"+
        "<button class='menu-btn' aria-label='Delete "+escapeHtml(g.name)+"'>&#215;</button>";

      // tap anywhere on card = toggle today
      function tap(e){
        toggleToday(g.id);
        // re-render but keep a pulse on the mark that just changed
        renderAndPulse(g.id);
      }
      card.addEventListener("click", function(e){
        if (e.target.closest(".menu-btn")) return;
        tap(e);
      });
      card.addEventListener("keydown", function(e){
        if (e.key===" "||e.key==="Enter"){ e.preventDefault(); tap(e); }
      });

      card.querySelector(".menu-btn").addEventListener("click", function(e){
        e.stopPropagation();
        confirmDelete(g);
      });

      list.appendChild(card);
    });

    content.innerHTML = "";
    content.appendChild(list);
  }

  var pulseId = null;
  function renderAndPulse(id){
    pulseId = id;
    render();
    if (pulseId){
      var cards = content.querySelectorAll(".card");
      // find matching card by index
      var idx = state.goals.findIndex(function(g){return g.id===id;});
      if (idx>=0 && cards[idx] && cards[idx].classList.contains("done")){
        var m = cards[idx].querySelector(".mark");
        if (m){ m.classList.add("pulse"); }
      }
    }
    pulseId = null;
  }

  function renderEmpty(){
    var wrap = document.createElement("div");
    wrap.className = "empty";
    wrap.innerHTML =
      "<h2>Start with one thing.</h2>"+
      "<p>Add a goal you want to keep alive, then tap it on each day you do it. Small and steady beats big and rare.</p>";
    var row = document.createElement("div");
    row.className = "starters";
    [
      {name:"Read 20 minutes", cat:"Reading"},
      {name:"Gym", cat:"Gym"},
      {name:"Deep-work task", cat:"Tasks"},
      {name:"Play, guilt-free", cat:"Games"}
    ].forEach(function(s){
      var b = document.createElement("button");
      b.className = "starter";
      b.style.setProperty("--tone", toneFor(s.cat));
      b.innerHTML = "<span class='swatch'></span>"+s.name;
      b.addEventListener("click", function(){ addGoal(s.name, s.cat); });
      row.appendChild(b);
    });
    wrap.appendChild(row);
    content.innerHTML = "";
    content.appendChild(wrap);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---- add goal flow ---- */
  var scrim = document.getElementById("scrim");
  var gInput = document.getElementById("gInput");
  var saveBtn = document.getElementById("saveBtn");
  var chipsBox = document.getElementById("chips");
  var pickedCat = "Reading";

  function buildChips(){
    chipsBox.innerHTML = "";
    CATS.forEach(function(c){
      var b = document.createElement("button");
      b.className = "chip" + (c.id===pickedCat?" sel":"");
      b.style.setProperty("--tone", c.tone);
      b.innerHTML = "<span class='swatch'></span>"+c.id;
      b.addEventListener("click", function(){
        pickedCat = c.id;
        buildChips();
      });
      chipsBox.appendChild(b);
    });
  }

  function openSheet(){
    pickedCat = "Reading";
    gInput.value = "";
    saveBtn.disabled = true;
    buildChips();
    scrim.classList.add("open");
    setTimeout(function(){ gInput.focus(); }, 60);
  }
  function closeSheet(){ scrim.classList.remove("open"); }

  gInput.addEventListener("input", function(){
    saveBtn.disabled = gInput.value.trim().length === 0;
  });
  gInput.addEventListener("keydown", function(e){
    if (e.key==="Enter" && gInput.value.trim()){ commitAdd(); }
  });

  function commitAdd(){
    var name = gInput.value.trim();
    if (!name) return;
    addGoal(name, pickedCat);
    closeSheet();
  }

  function addGoal(name, cat){
    state.goals.push({ id: "g"+Date.now()+Math.floor(Math.random()*999), name:name, category:cat });
    save();
    render();
    toast("Added — tap it each day you do it");
  }

  function confirmDelete(g){
    if (confirm('Delete "'+g.name+'"? Your logged days for it will be removed.')){
      state.goals = state.goals.filter(function(x){return x.id!==g.id;});
      delete state.logs[g.id];
      save();
      render();
    }
  }

  document.getElementById("addBtn").addEventListener("click", openSheet);
  document.getElementById("cancelBtn").addEventListener("click", closeSheet);
  saveBtn.addEventListener("click", commitAdd);
  scrim.addEventListener("click", function(e){ if (e.target===scrim) closeSheet(); });

  /* ---- toast ---- */
  var toastEl = document.getElementById("toast"), toastT=null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 1900);
  }

  /* ---- date label ---- */
  (function(){
    var d = new Date();
    document.getElementById("date").textContent =
      d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
  })();

  /* ---- install hint ---- */
  document.getElementById("installHint").addEventListener("click", function(){
    var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (iOS){
      alert("On iPhone:\n\n1. Tap the Share button (the square with an arrow) at the bottom of Safari.\n2. Scroll down and tap \"Add to Home Screen\".\n3. Tap Add.\n\nEmber will open fullscreen like a normal app, and works offline.");
    } else {
      alert("On Android (Chrome):\n\n1. Tap the ⋮ menu in the top-right.\n2. Tap \"Add to Home screen\" (or \"Install app\").\n3. Confirm.\n\nEmber will open fullscreen like a normal app, and works offline.");
    }
  });

  /* ---- build a manifest at runtime so a single file can still 'install' ---- */
  try{
    var icon = "data:image/svg+xml;utf8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'>"+
      "<rect width='512' height='512' rx='112' fill='#16211F'/>"+
      "<path d='M256 96c30 64 108 94 108 188a108 108 0 0 1-216 0c0-36 15-60 32-79 6 30 10 54 6 71 26-12 43-28 51-52 4 30-4 78 19 0z' fill='#E8B04B'/>"+
      "</svg>"
    );
    var manifest = {
      name:"Ember", short_name:"Ember",
      display:"standalone", background_color:"#16211F", theme_color:"#16211F",
      icons:[{ src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable" }]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

    var apple = document.createElement("link");
    apple.rel = "apple-touch-icon";
    apple.href = icon;
    document.head.appendChild(apple);
  }catch(e){}

  render();
})();
</script>
</body>
</html>
