<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>
<meta name="theme-color" content="#16211F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16211F; --bg-2:#101917; --surface:#1E2C2A; --surface-2:#243532;
    --line:#2C3D3A; --ink:#F2EDE4; --muted:#93A29E; --muted-dim:#6E7E7A;
    --ember:#E8B04B; --ember-soft:rgba(232,176,75,.14); --ember-line:rgba(232,176,75,.45);
    --shadow:0 10px 30px rgba(0,0,0,.35); --r:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(120% 80% at 50% -10%, #1B2A28 0%, var(--bg) 55%, var(--bg-2) 100%) fixed, var(--bg);
    color:var(--ink); font-family:"Instrument Sans", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh; line-height:1.45;}
  .wrap{max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 108px);}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand svg{width:22px; height:22px; display:block;}
  .brand .name{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:20px; letter-spacing:.2px;}
  .add-top{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ember);
    display:grid; place-items:center; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .add-top:active{transform:scale(.95);} .add-top svg{width:20px;height:20px;}

  .hero{margin:2px 0 26px;}
  .greeting{color:var(--muted); font-size:14px; margin-bottom:8px; display:flex; gap:8px; align-items:baseline;}
  .greeting .dot{color:var(--muted-dim);}
  .headline{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:clamp(22px,6.2vw,27px); line-height:1.25; color:var(--ink); max-width:24ch;}
  .headline .num{color:var(--ember); font-weight:600;}
  .streakline{margin-top:12px; color:var(--muted); font-size:14px; display:flex; align-items:center; gap:7px;}
  .streakline b{color:var(--ink); font-weight:600;}
  .flame{width:15px;height:15px;display:inline-block;vertical-align:-2px;}

  .list{display:flex; flex-direction:column; gap:12px;}
  .card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:15px 15px 15px 18px; display:flex; align-items:center; gap:12px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; overflow:hidden; transition:border-color .18s ease, background .18s ease, transform .12s ease;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tone,#7E8C88); opacity:.9;}
  .card:active{transform:scale(.992);}
  .card.done{background:linear-gradient(180deg, var(--ember-soft), transparent), var(--surface); border-color:var(--ember-line);}
  .body{flex:1; min-width:0;}
  .titlerow{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .gname{font-size:16.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .tag{flex:none; font-size:10.5px; font-weight:600; letter-spacing:.2px; color:var(--muted);
    background:var(--surface-2); padding:2px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;}
  .tag.tone{color:var(--tone,#7E8C88); background:color-mix(in srgb, var(--tone,#7E8C88) 15%, transparent);}
  .tag svg{width:11px;height:11px;}
  .goaltext{color:var(--muted); font-size:12.5px; margin:-2px 0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .week{display:flex; gap:6px; align-items:center;}
  .dot{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--line); background:transparent;}
  .dot.on{background:var(--tone,#7E8C88); border-color:var(--tone,#7E8C88);}
  .dot.today{border-color:var(--muted);}
  .dot.today.on{border-color:var(--tone,#7E8C88); box-shadow:0 0 0 2px color-mix(in srgb, var(--tone,#7E8C88) 25%, transparent);}
  .streak-badge{margin-left:auto; display:none; align-items:center; gap:4px; color:var(--ember); font-size:13px; font-weight:600;}
  .streak-badge.show{display:flex;}
  .card-side{flex:none; display:flex; flex-direction:column; align-items:center; gap:9px; width:44px;}
  .mark{flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center;
    color:transparent; transition:border-color .18s ease, background .18s ease, transform .18s ease;}
  .mark svg{width:21px;height:21px;}
  .card.done .mark{border-color:var(--ember); background:var(--ember); color:#231a06;}
  .card.done .mark.pulse{animation:pop .42s cubic-bezier(.2,.9,.3,1.3);}
  @keyframes pop{0%{transform:scale(.7);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
  .menu-btn{flex:none; position:static; width:36px; height:36px; border:0; background:transparent; color:var(--muted-dim);
    cursor:pointer; border-radius:9px; display:grid; place-items:center;}
  .menu-btn svg{width:16px;height:16px;}
  .menu-btn:hover{color:var(--muted); background:var(--surface-2);}

  /* tasks */
  .task{display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:14px 15px; cursor:pointer; position:relative; overflow:hidden;}
  .task:active{transform:scale(.992);}
  .task .tcheck{flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; color:transparent;}
  .task .tcheck svg{width:15px;height:15px;}
  .task.done .tcheck{border-color:var(--ember); background:var(--ember); color:#231a06;}
  .task .tname{flex:1; min-width:0; font-weight:600; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .task.done .tname{color:var(--muted-dim); text-decoration:line-through;}
  .task .tdue{flex:none; font-size:12px; color:var(--muted); background:var(--surface-2); padding:3px 9px; border-radius:999px;}
  .task .tdue.over{color:#231a06; background:var(--ember);}
  .task .tdel{flex:none; width:36px; height:36px; border:0; background:transparent; color:var(--muted-dim); cursor:pointer; border-radius:9px; display:grid; place-items:center;}
  .task .tdel:hover{color:var(--muted); background:var(--surface-2);}
  .task .tdel svg{width:16px;height:16px;}
  .subhead{color:var(--muted); font-size:12.5px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; margin:20px 2px 4px;}

  /* gym */
  .gym-stats{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .stat .n{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:26px; color:var(--ember); line-height:1;}
  .stat .l{color:var(--muted); font-size:12.5px; margin-top:4px;}
  .cal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:18px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-title{font-family:"Fraunces",Georgia,serif; font-weight:500; font-size:18px;}
  .cal-nav{display:flex; gap:6px;}
  .cal-nav button{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; font-size:17px; line-height:1;}
  .cal-nav button:hover{border-color:var(--muted);}
  .cal-wd{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-wd span{text-align:center; color:var(--muted-dim); font-size:11px; font-weight:600;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-cell{aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:14px; color:var(--ink); cursor:pointer; border:1px solid transparent; -webkit-tap-highlight-color:transparent;}
  .cal-cell.blank{cursor:default;}
  .cal-cell:not(.blank):active{transform:scale(.94);}
  .cal-cell:not(.blank):hover{background:var(--surface-2);}
  .cal-cell.today{border-color:var(--muted);}
  .cal-cell .cdot{width:6px; height:6px; border-radius:50%; background:transparent;}
  .cal-cell.has{background:var(--ember-soft);}
  .cal-cell.has .cdot{background:var(--ember);}
  .cal-cell.has.today{border-color:var(--ember-line);}
  .recent-title{color:var(--muted); font-size:13px; margin:2px 0 10px;}
  .recent{display:flex; flex-direction:column; gap:8px;}
  .recent-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer;}
  .recent-row:hover{border-color:var(--muted);}
  .recent-row .rd{color:var(--muted); font-size:12.5px; min-width:78px; flex:none;}
  .recent-row .rt{font-weight:600; font-size:14.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* free */
  .free-card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; overflow:hidden;}
  .free-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .free-name{font-size:16.5px; font-weight:600;}
  .free-best{color:var(--muted); font-size:12.5px; white-space:nowrap;}
  .free-count{display:flex; align-items:baseline; gap:10px; margin-bottom:4px;}
  .free-days{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:44px; line-height:1; color:var(--ember);}
  .free-dlabel{color:var(--muted); font-size:14px;}
  .free-clock{color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; letter-spacing:.5px; margin-bottom:16px;}
  .bar-label{display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; margin-bottom:7px;}
  .bar{height:8px; border-radius:999px; background:var(--bg-2); overflow:hidden; border:1px solid var(--line);}
  .bar-fill{height:100%; background:linear-gradient(90deg,#C98A5E,var(--ember)); border-radius:999px; transition:width .5s ease;}
  .miles{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
  .mile{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted-dim);}
  .mile.hit{color:#231a06; background:var(--ember); border-color:var(--ember); font-weight:600;}
  .free-actions{display:flex; gap:8px; margin-top:16px;}
  .free-reset{flex:1; border:1px solid var(--line); background:transparent; color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:600; padding:10px; border-radius:11px; cursor:pointer;}
  .free-reset:hover{border-color:var(--ember-line);}
  .free-del{flex:none; width:44px; height:44px; border:1px solid var(--line); background:transparent; color:var(--muted-dim); border-radius:11px; cursor:pointer; display:grid; place-items:center;}
  .free-del svg{width:17px;height:17px;}

  .empty{text-align:center; padding:30px 8px 8px;}
  .empty h2{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:22px; margin:0 0 8px;}
  .empty p{color:var(--muted); margin:0 auto 22px; max-width:32ch; font-size:14.5px;}
  .starters{display:flex; flex-wrap:wrap; gap:9px; justify-content:center;}
  .starter{border:1px dashed var(--line); background:transparent; color:var(--ink); padding:9px 14px; border-radius:999px; font-size:14px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:7px;}
  .starter:hover{border-color:var(--muted); background:var(--surface);}
  .starter .swatch{width:9px;height:9px;border-radius:50%;background:var(--tone,var(--ember));}

  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:40; background:color-mix(in srgb, var(--bg-2) 86%, transparent);
    backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:8px 8px calc(env(safe-area-inset-bottom) + 8px); display:flex; justify-content:center; gap:4px;}
  .tab{flex:1; max-width:130px; background:transparent; border:0; cursor:pointer; font-family:inherit; color:var(--muted-dim);
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px; border-radius:12px; font-size:11px; font-weight:600;}
  .tab svg{width:21px;height:21px;}
  .tab.active{color:var(--ember);}
  .tab.active .tabwrap{background:var(--ember-soft);}
  .tabwrap{width:50px; height:29px; border-radius:999px; display:grid; place-items:center; transition:background .15s ease;}

  .scrim{position:fixed; inset:0; background:rgba(8,13,12,.6); backdrop-filter:blur(3px); display:none; align-items:flex-end; justify-content:center; z-index:60;}
  .scrim.open{display:flex;}
  .sheet{background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0; border:1px solid var(--line); border-bottom:0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 22px); animation:rise .24s ease; max-height:88vh; overflow-y:auto;}
  @keyframes rise{from{transform:translateY(30px); opacity:.6;} to{transform:none; opacity:1;}}
  .sheet h3{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:20px; margin:2px 0 6px;}
  .sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  .sheet-close{flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); display:grid; place-items:center; cursor:pointer; margin-top:-2px;}
  .sheet-close svg{width:17px;height:17px;}
  .sheet-close:hover{border-color:var(--muted);}
  .sheet-sub{display:block; color:var(--muted); font-size:13px; margin-bottom:16px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .field input[type=text], .field input[type=date]{width:100%; background:var(--bg-2); border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:16px; padding:13px 14px; border-radius:12px; outline:none;}
  .field input:focus{border-color:var(--ember-line);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:var(--bg-2); color:var(--ink); padding:9px 13px; border-radius:999px; font-size:14px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:7px;}
  .chip .swatch{width:9px;height:9px;border-radius:50%;background:var(--tone,var(--ember));}
  .chip.sel{border-color:var(--tone,var(--ember)); background:color-mix(in srgb, var(--tone,var(--ember)) 16%, var(--bg-2));}
  .custom-min{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .custom-min label{color:var(--muted); font-size:13px; flex:none;}
  .custom-min input{width:88px; background:var(--bg-2); border:1px solid var(--line); color:var(--ink); font-family:inherit;
    font-size:15px; padding:9px 10px; border-radius:10px; outline:none; text-align:center;}
  .custom-min input:focus{border-color:var(--ember-line);}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer;}
  .toggle .tl{font-size:14.5px; font-weight:600;} .toggle .ts{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .switch{flex:none; width:44px; height:26px; border-radius:999px; background:var(--line); position:relative; transition:background .15s ease;}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--ink); transition:transform .15s ease;}
  .toggle.on .switch{background:var(--ember);} .toggle.on .switch::after{transform:translateX(18px); background:#231a06;}

  .actions{display:flex; gap:10px; margin-top:24px;}
  .btn{flex:1; border-radius:12px; padding:14px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink);}
  .btn.primary{background:var(--ember); color:#231a06; border-color:var(--ember);}
  .btn.primary:disabled{opacity:.4; cursor:default;}
  .btn.ghost{width:100%; flex:none; border-style:dashed; color:var(--muted); margin-top:6px;}
  .btn:active{transform:scale(.98);}

  /* gym exercise editor */
  .ex{background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:12px;}
  .ex-head{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .ex-name{flex:1; background:var(--surface); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:15px; font-weight:600; padding:10px 12px; border-radius:10px; outline:none;}
  .ex-del{flex:none; width:36px; height:38px; border:1px solid var(--line); background:transparent; color:var(--muted-dim); border-radius:10px; font-size:16px; cursor:pointer;}
  .sets{display:flex; flex-direction:column; gap:7px;}
  .set-row{display:flex; align-items:center; gap:8px;}
  .set-n{flex:none; width:20px; color:var(--muted-dim); font-size:12.5px; text-align:center;}
  .mini{flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:15px; padding:9px 10px; border-radius:9px; outline:none; text-align:center;}
  .mini:focus{border-color:var(--ember-line);}
  .setx{flex:none; color:var(--muted-dim); font-size:13px;}
  .set-del{flex:none; width:30px; height:34px; border:0; background:transparent; color:var(--muted-dim); font-size:15px; cursor:pointer;}
  .add-set{margin-top:9px; background:transparent; border:0; color:var(--ember); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:2px;}
  .unit-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; color:var(--muted); font-size:13px;}
  .unit-row button{border:1px solid var(--line); background:var(--bg-2); color:var(--muted); font-family:inherit; font-size:13px; padding:6px 12px; border-radius:999px; cursor:pointer;}
  .unit-row button.sel{border-color:var(--ember); color:var(--ember);}

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(env(safe-area-inset-bottom) + 92px);
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line); padding:10px 16px; border-radius:999px; font-size:14px; opacity:0;
    pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:90; box-shadow:var(--shadow); text-align:center; max-width:88vw;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .hint{margin-top:28px; text-align:center; color:var(--muted-dim); font-size:12.5px; line-height:1.6;}
  .hint a{color:var(--muted); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;}

  .focus{position:fixed; inset:0; z-index:80; display:none; flex-direction:column; align-items:stretch;
    background:radial-gradient(120% 90% at 50% 10%, #1B2A28, var(--bg) 60%, var(--bg-2)); text-align:center;}
  .focus.open{display:flex;}
  .focus-head{flex:none; display:flex; align-items:flex-start; justify-content:flex-end;
    padding:calc(env(safe-area-inset-top) + 16px) 20px 0;}
  .focus-x{flex:none; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); display:grid; place-items:center; cursor:pointer;}
  .focus-x svg{width:19px;height:19px;}
  .focus-x:hover{border-color:var(--muted);}
  .focus-body{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px 30px calc(env(safe-area-inset-bottom) + 30px);}
  .focus-cat{color:var(--tone,var(--ember)); font-size:12px; font-weight:600; letter-spacing:.3px; margin-bottom:6px;}
  .focus-name{font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:24px; margin-bottom:22px; max-width:20ch;}
  .ring-wrap{position:relative; width:clamp(200px,58vw,260px); height:clamp(200px,58vw,260px); margin-bottom:8px; flex:none;}
  .ring{width:100%; height:100%;}
  .ring-bg{fill:none; stroke:var(--line); stroke-width:10;}
  .ring-fg{fill:none; stroke:var(--ember); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .3s linear;}
  .ring-time{position:absolute; inset:0; display:grid; place-items:center; font-family:"Fraunces", Georgia, serif; font-weight:500; font-size:clamp(36px,10vw,52px); font-variant-numeric:tabular-nums; letter-spacing:1px;}
  .focus-adjust{display:flex; align-items:center; justify-content:center; gap:10px; margin:20px 0 8px; flex-wrap:wrap;}
  .step{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:22px; cursor:pointer;}
  .presets{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .preset{border:1px solid var(--line); background:transparent; color:var(--muted); font-family:inherit; font-size:13px; padding:7px 12px; border-radius:999px; cursor:pointer;}
  .preset.sel{border-color:var(--ember); color:var(--ember);}
  .focus-actions{flex:none; display:flex; gap:12px; justify-content:center; margin-top:20px; width:100%; max-width:320px;}
  .focus-actions .btn{flex:1;}
  .focus-done{font-family:"Fraunces",Georgia,serif; font-size:22px; color:var(--ember); margin-top:18px; display:none;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>

</head>
<body>

<script>
(function(){
  "use strict";
  var KEY="ember.v1";
  var DAY=86400000, HOUR=3600000, MIN=60000;

  var CATS=[
    {id:"Reading",tone:"#C98A5E"},{id:"Work",tone:"#5E9C93"},{id:"Writing",tone:"#8E7BC4"},
    {id:"Health",tone:"#C9615C"},{id:"Mind",tone:"#6FA8C9"},{id:"Other",tone:"#7E8C88"}
  ];
  function toneFor(cat){ var c=CATS.find(function(x){return x.id===cat;}); return c?c.tone:"#7E8C88"; }

  var SUGGEST=[
    {name:"Reading",cat:"Reading"},{name:"Working",cat:"Work"},{name:"Writing",cat:"Writing"},
    {name:"Studying",cat:"Work"},{name:"Meditate",cat:"Mind"},{name:"Exercise",cat:"Health"},
    {name:"Journal",cat:"Writing"},{name:"Walk",cat:"Health"},{name:"Drink water",cat:"Health"},{name:"Sleep early",cat:"Health"}
  ];

  var LADDER=[
    {label:"1 day",ms:1*DAY},{label:"3 days",ms:3*DAY},{label:"1 week",ms:7*DAY},{label:"2 weeks",ms:14*DAY},
    {label:"1 month",ms:30*DAY},{label:"3 months",ms:90*DAY},{label:"6 months",ms:180*DAY},{label:"1 year",ms:365*DAY}
  ];

  // ---------- state + migration ----------
  var state={ habits:[], logs:{}, sessions:{}, free:[], workouts:{}, tasks:[], settings:{unit:"kg"} };
  try{ var raw=localStorage.getItem(KEY); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==="object") state=p; } }catch(e){}
  // migrate older shapes
  var migratedFromGoals=false;
  if(!Array.isArray(state.habits)){
    state.habits = Array.isArray(state.goals) ? state.goals.map(function(g){
      return { id:g.id, name:g.name, category:g.category, freq:7, pomodoro:!!g.minutes, minutes:g.minutes||25, goalEnabled:false, created:g.created||Date.now() };
    }) : [];
    migratedFromGoals = Array.isArray(state.goals);
  }
  if(state.goals) delete state.goals;
  if(!state.logs) state.logs={};
  if(!state.sessions||typeof state.sessions!=="object") state.sessions={};
  if(!Array.isArray(state.free)) state.free=[];
  if(!Array.isArray(state.tasks)) state.tasks=[];
  if(!state.settings||typeof state.settings!=="object") state.settings={unit:"kg"};
  if(!state.settings.notifiedTasksDate) state.settings.notifiedTasksDate=null;
  if(!state.workouts||typeof state.workouts!=="object") state.workouts={};
  // migrate workout strings -> {exercises:[],note}
  var migratedWorkout=false;
  Object.keys(state.workouts).forEach(function(d){
    var v=state.workouts[d];
    if(typeof v==="string"){ state.workouts[d]={exercises:[], note:v}; migratedWorkout=true; }
    else if(v&&!Array.isArray(v.exercises)) v.exercises=[];
  });

  var lastSave=0;
  function save(){ lastSave=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  if(migratedFromGoals || migratedWorkout) save();   // persist migrated shape immediately, don't wait for a user action

  // ---------- date helpers ----------
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function today(){ return ymd(new Date()); }
  function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return ymd(d); }
  function parseYmd(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/DAY); }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function flameSVG(){ return "<svg class='flame' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 2c1.4 3 5 4.4 5 8.8a5 5 0 0 1-10 0c0-1.7.7-2.8 1.5-3.7C9 8.5 9.2 7.4 9 6.6c1.2.5 2 1.3 2.4 2.4C11.8 7.4 11.2 4.8 12 2z' fill='#E8B04B'/></svg>"; }
  function dumbSVG(){ return "<svg class='flame' viewBox='0 0 24 24' fill='none' stroke='#E8B04B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 7v10M17.5 7v10M4 9.5v5M20 9.5v5M6.5 12h11'/></svg>"; }
  function checkSVG(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7'/></svg>"; }
  function clockSVG(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/></svg>"; }
  function targetSVG(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='9'/><circle cx='12' cy='12' r='5'/><circle cx='12' cy='12' r='1.5' fill='currentColor'/></svg>"; }
  function trashSVG(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 7h16M9 7V4.8c0-.44.36-.8.8-.8h4.4c.44 0 .8.36.8.8V7M6 7l1 13.2c.05.98.86 1.8 1.84 1.8h6.32c.98 0 1.79-.82 1.84-1.8L18 7'/><path d='M10 11v6M14 11v6'/></svg>"; }

  // ---------- habits ----------
  function logsFor(id){ return state.logs[id] || (state.logs[id]=[]); }
  function sessFor(id){ return state.sessions[id] || (state.sessions[id]={}); }
  function isDone(id,day){ return logsFor(id).indexOf(day)!==-1; }
  function freqLabel(f){ return f>=7?"Daily":(f===1?"Weekly":f+"×/wk"); }
  function gapDays(f){ return Math.max(1, Math.ceil(7/f)); }

  function habitStreak(h){
    var dates=logsFor(h.id).slice().sort();
    if(!dates.length) return 0;
    var gap=gapDays(h.freq||7);
    var last=dates[dates.length-1];
    if(daysBetween(last, today())>gap) return 0;      // lapsed
    var n=1;
    for(var i=dates.length-1;i>0;i--){ if(daysBetween(dates[i-1],dates[i])<=gap) n++; else break; }
    return n;
  }
  function weekProgress(h){
    var s=startOfWeek(), n=0;
    for(var i=0;i<7;i++){ var dd=new Date(s); dd.setDate(s.getDate()+i); if(isDone(h.id,ymd(dd))) n++; }
    return n;
  }
  function doneTodayCount(){ return state.habits.reduce(function(a,h){ return a+(isDone(h.id,today())?1:0); },0); }
  function bestStreak(){ return state.habits.reduce(function(m,h){ return Math.max(m,habitStreak(h)); },0); }

  function completeHabit(h, goalText, min){
    var t=today();
    if(logsFor(h.id).indexOf(t)===-1) logsFor(h.id).push(t);
    if((goalText&&goalText.trim())||min){ sessFor(h.id)[t]={ goal:(goalText||"").trim(), min:min||0 }; }
    save();
  }
  function uncompleteHabit(h){
    var t=today(), arr=logsFor(h.id), i=arr.indexOf(t);
    if(i!==-1) arr.splice(i,1);
    if(sessFor(h.id)[t]) delete sessFor(h.id)[t];
    save();
  }
  function lastGoal(h){
    var m=sessFor(h.id), keys=Object.keys(m).sort();
    return keys.length ? (m[keys[keys.length-1]].goal||"") : "";
  }

  // ---------- gym ----------
  var gymY=new Date().getFullYear(), gymM=new Date().getMonth();
  function workoutOf(d){ return state.workouts[d]; }
  function hasWorkout(d){ var w=state.workouts[d]; if(!w) return false; var ex=(w.exercises||[]).some(function(e){return e.name&&e.name.trim();}); return ex || !!(w.note&&w.note.trim()); }
  function monthCount(y,m){ var pre=y+"-"+String(m+1).padStart(2,"0")+"-", n=0; for(var k in state.workouts){ if(k.indexOf(pre)===0 && hasWorkout(k)) n++; } return n; }
  function startOfWeek(){ var d=new Date(); var wd=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-wd); return d; }
  function weekWorkouts(){ var s=startOfWeek(), n=0; for(var i=0;i<7;i++){ var dd=new Date(s); dd.setDate(s.getDate()+i); if(hasWorkout(ymd(dd))) n++; } return n; }
  function workoutSummary(d){
    var w=state.workouts[d]; if(!w) return "";
    var names=(w.exercises||[]).filter(function(e){return e.name&&e.name.trim();}).map(function(e){return e.name.trim();});
    if(names.length){ var s=names.slice(0,3).join(", "); if(names.length>3) s+=" +"+(names.length-3); return s; }
    return w.note||"";
  }

  // ---------- tasks ----------
  function taskDueLabel(t){
    if(!t.due) return "";
    var diff=daysBetween(today(), t.due);
    if(diff<0) return {txt:"Overdue", over:true};
    if(diff===0) return {txt:"Today", over:false};
    if(diff===1) return {txt:"Tomorrow", over:false};
    var d=parseYmd(t.due);
    return {txt:d.toLocaleDateString(undefined,{month:"short",day:"numeric"}), over:false};
  }

  // ================= views =================
  var view="habits";
  var content=document.getElementById("content");
  function greet(){ var h=new Date().getHours(); return h<5?"Late night":h<12?"Good morning":h<18?"Good afternoon":"Good evening"; }

  function renderHero(){
    document.getElementById("greeting").textContent=greet();
    var hl=document.getElementById("headline"), sl=document.getElementById("streakline");
    sl.style.display="none";
    if(view==="habits"){
      var g=state.habits.length, done=doneTodayCount();
      if(g===0){ hl.textContent="Build a rhythm, one habit at a time."; return; }
      if(done===0) hl.innerHTML="Nothing done yet today — pick one to start.";
      else if(done===g) hl.innerHTML="All habits done today. <span class='num'>"+done+"/"+g+"</span>";
      else hl.innerHTML="You've done <span class='num'>"+done+"</span> of "+g+" today.";
      var best=bestStreak();
      if(best>0){ sl.style.display="flex"; sl.innerHTML=flameSVG()+" Longest streak: <b>&nbsp;"+best+"</b>"; }
    } else if(view==="gym"){
      var mc=monthCount(new Date().getFullYear(), new Date().getMonth());
      hl.innerHTML = mc===0 ? "No workouts logged this month yet." : "<span class='num'>"+mc+"</span> workout"+(mc===1?"":"s")+" this month.";
      sl.style.display="flex"; sl.innerHTML=dumbSVG()+" This week: <b>&nbsp;"+weekWorkouts()+"</b>";
    } else if(view==="tasks"){
      var open=state.tasks.filter(function(t){return !t.done;}).length;
      var over=state.tasks.filter(function(t){return !t.done && t.due && daysBetween(today(),t.due)<0;}).length;
      hl.innerHTML = open===0 ? "No open tasks. Clear head." : "<span class='num'>"+open+"</span> task"+(open===1?"":"s")+" to do.";
      if(over>0){ sl.style.display="flex"; sl.innerHTML="<b style='color:var(--ember)'>"+over+"</b>&nbsp; overdue"; }
    } else if(view==="free"){
      var f=state.free.length;
      if(f===0){ hl.textContent="Track time away from what pulls you back."; return; }
      var longest=state.free.reduce(function(m,x){ return Math.max(m, Date.now()-x.start); },0);
      var d=Math.floor(longest/DAY);
      hl.innerHTML = f===1 ? "One thing you're staying free from." : "<span class='num'>"+f+"</span> things you're staying free from.";
      sl.style.display="flex"; sl.innerHTML=flameSVG()+" Longest run right now: <b>&nbsp;"+d+" day"+(d===1?"":"s")+"</b>";
    }
  }

  // ---- habits view ----
  function renderHabits(){
    if(state.habits.length===0){ return renderEmptyHabits(); }
    var list=document.createElement("div"); list.className="list";
    state.habits.forEach(function(h){
      var done=isDone(h.id,today()), st=habitStreak(h), tone=toneFor(h.category);
      var card=document.createElement("div");
      card.className="card"+(done?" done":""); card.style.setProperty("--tone",tone);
      card.setAttribute("role","button"); card.setAttribute("tabindex","0");
      card.setAttribute("aria-pressed", done?"true":"false");

      var tags="<span class='tag tone'>"+freqLabel(h.freq||7)+"</span>";
      if(h.pomodoro) tags+="<span class='tag'>"+clockSVG()+(h.minutes||25)+"m</span>";
      if(h.goalEnabled) tags+="<span class='tag'>"+targetSVG()+"Goal</span>";

      var gt=""; var todayGoal=(sessFor(h.id)[today()]||{}).goal;
      if(todayGoal) gt="<div class='goaltext'>Today: "+escapeHtml(todayGoal)+"</div>";

      var dots="";
      for(var i=6;i>=0;i--){ dots+="<span class='dot"+(isDone(h.id,daysAgo(i))?" on":"")+(i===0?" today":"")+"'></span>"; }
      var badge = st>0 ? "<span class='streak-badge show'>"+flameSVG()+st+"</span>" : "<span class='streak-badge'></span>";

      card.innerHTML=
        "<div class='body'>"+
          "<div class='titlerow'><span class='gname'>"+escapeHtml(h.name)+"</span>"+tags+"</div>"+
          gt+
          "<div class='week'>"+dots+badge+"</div>"+
        "</div>"+
        "<div class='card-side'>"+
          "<div class='mark'>"+checkSVG()+"</div>"+
          "<button class='menu-btn' aria-label='Delete "+escapeHtml(h.name)+"'>"+trashSVG()+"</button>"+
        "</div>";

      card.addEventListener("click", function(e){
        if(e.target.closest(".menu-btn")) return;
        onHabitTap(h);
      });
      card.addEventListener("keydown", function(e){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); onHabitTap(h); } });
      card.querySelector(".menu-btn").addEventListener("click", function(e){ e.stopPropagation(); confirmDeleteHabit(h); });
      list.appendChild(card);
    });
    content.innerHTML=""; content.appendChild(list);
  }
  function onHabitTap(h){
    if(isDone(h.id,today())){ uncompleteHabit(h); renderHabits(); renderHero(); return; }

  function tickFree(){

    freeRefs.forEach(function(r){
      var elapsed=now-r.item.start; if(elapsed<0) elapsed=0;
      if(elapsed>(r.item.best||0)){ r.item.best=elapsed; changed=true; }
      var days=Math.floor(elapsed/DAY), root=r.root;
      root.querySelector("[data-days]").textContent=days;
      root.querySelector("[data-dlabel]").textContent=days===1?"day free":"days free";
      root.querySelector("[data-clock]").textContent=fmtClock(elapsed);
      var bd=Math.floor((r.item.best||0)/DAY);
      root.querySelector("[data-best]").textContent="Best: "+bd+" day"+(bd===1?"":"s");
      var mi=milestoneInfo(elapsed);
      root.querySelector("[data-nextlabel]").textContent=mi.done?"All milestones reached":("Next: "+mi.label);
      root.querySelector("[data-pct]").textContent=Math.floor(mi.frac*100)+"%";
      root.querySelector("[data-fill]").style.width=(mi.frac*100)+"%";
      root.querySelectorAll(".mile").forEach(function(chip){ if(elapsed>=+chip.getAttribute("data-mms")) chip.classList.add("hit"); else chip.classList.remove("hit"); });

  function fmtTimer(ms){ var s=Math.max(0,Math.round(ms/1000)); var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; function p(n){return String(n).padStart(2,"0");} return h>0?h+":"+p(m)+":"+p(sec):m+":"+p(sec); }
  function setRing(frac){ ringFg.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,frac))); }
  function buildPresets(){ var box=document.getElementById("presets"); box.innerHTML=""; [10,20,25,30,45,60,90].forEach(function(v){ var b=document.createElement("button"); b.className="preset"+(v===T.minutes?" sel":""); b.textContent=v+"m"; b.addEventListener("click", function(){ T.minutes=v; refreshIdle(); }); box.appendChild(b); }); }
  function refreshIdle(){ if(T.minutes<1)T.minutes=1; if(T.minutes>180)T.minutes=180; document.getElementById("fTime").textContent=fmtTimer(T.minutes*MIN); setRing(0); buildPresets(); }
  function mkBtn(label,cls,fn){ var b=document.createElement("button"); b.className="btn"+(cls?" "+cls:""); b.textContent=label; b.addEventListener("click",fn); return b; }
  function renderActions(){
    var box=document.getElementById("fActions"); box.innerHTML="";
    document.getElementById("fDone").style.display=(T.mode==="done")?"block":"none";
    document.getElementById("fIdle").style.display=(T.mode==="idle")?"block":"none";
    if(T.mode==="idle") box.appendChild(mkBtn("Start","primary",startTimer));
    else if(T.mode==="running"){ box.appendChild(mkBtn("Pause","",pauseTimer)); box.appendChild(mkBtn("End","",function(){ endTimer(); })); }
    else if(T.mode==="paused"){ box.appendChild(mkBtn("Resume","primary",resumeTimer)); box.appendChild(mkBtn("End","",function(){ endTimer(); })); }
    else if(T.mode==="done") box.appendChild(mkBtn("Done","primary",closeTimer));
  }
  function openTimer(cfg){ T.title=cfg.title; T.minutes=cfg.minutes||25; T.onComplete=cfg.onComplete||null; T.mode="idle";
    document.getElementById("fCat").textContent=cfg.catLabel||""; focus.style.setProperty("--tone",cfg.cat||"var(--ember)"); document.getElementById("fName").textContent=cfg.title;
    refreshIdle(); renderActions(); focus.classList.add("open"); }
  function ensureAudio(){ try{ if(!T.actx){ T.actx=new (window.AudioContext||window.webkitAudioContext)(); } if(T.actx.state==="suspended") T.actx.resume(); }catch(e){} }
  function beep(){ try{ if(!T.actx) return; var o=T.actx.createOscillator(), g=T.actx.createGain(); o.connect(g); g.connect(T.actx.destination); o.type="sine"; o.frequency.value=660; var t=T.actx.currentTime; g.gain.value=0.001; g.gain.exponentialRampToValueAtTime(0.25,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.9); o.start(t); o.stop(t+0.95); }catch(e){} }
  function acquireWake(){ try{ if(navigator.wakeLock){ navigator.wakeLock.request("screen").then(function(w){ T.wake=w; }).catch(function(){}); } }catch(e){} }
  function releaseWake(){ try{ if(T.wake){ T.wake.release(); T.wake=null; } }catch(e){} }
  function startTimer(){ askNotifyPermission(); ensureAudio(); acquireWake(); T.totalMs=T.minutes*MIN; T.endAt=Date.now()+T.totalMs; T.mode="running"; renderActions(); loop(); if(T.iv) clearInterval(T.iv); T.iv=setInterval(loop,250); }
  function loop(){ if(T.mode!=="running") return; var rem=T.endAt-Date.now(); if(rem<=0){ rem=0; finishTimer(); } document.getElementById("fTime").textContent=fmtTimer(rem); setRing((T.totalMs-rem)/T.totalMs); }
  function pauseTimer(){ if(T.mode!=="running")return; T.remaining=T.endAt-Date.now(); T.mode="paused"; if(T.iv){clearInterval(T.iv);T.iv=null;} renderActions(); releaseWake(); }
  function resumeTimer(){ if(T.mode!=="paused")return; T.endAt=Date.now()+T.remaining; T.mode="running"; acquireWake(); renderActions(); T.iv=setInterval(loop,250); }
  function endTimer(){ if(T.iv){clearInterval(T.iv);T.iv=null;} releaseWake(); closeTimer(); }
  function finishTimer(){ if(T.iv){clearInterval(T.iv);T.iv=null;} T.mode="done"; setRing(1); document.getElementById("fTime").textContent=fmtTimer(0); releaseWake(); beep(); try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){} notify("Ember", T.title+" — session complete."); if(T.onComplete){ try{ T.onComplete(); }catch(e){} } renderActions(); }
  function closeTimer(){ if(T.iv){clearInterval(T.iv);T.iv=null;} releaseWake(); focus.classList.remove("open"); T.mode="idle"; render(); }
  document.getElementById("minus").addEventListener("click", function(){ if(T.mode==="idle"){ T.minutes-=5; refreshIdle(); } });
  document.getElementById("plus").addEventListener("click", function(){ if(T.mode==="idle"){ T.minutes+=5; refreshIdle(); } });
  document.getElementById("fClose").addEventListener("click", function(){ if(T.mode==="running"||T.mode==="paused"){ if(!confirm("End this session? It won't be counted.")) return; } endTimer(); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && T.mode==="running"){ acquireWake(); loop(); } });

  // ================= tabs =================
  function setView(v){
    view=v;
    ["Habits","Gym","Tasks","Free"].forEach(function(n){ document.getElementById("tab"+n).classList.toggle("active", v===n.toLowerCase()); });
    document.getElementById("hint").style.display=(v==="habits")?"":"none";
    render();
  }
  document.getElementById("tabHabits").addEventListener("click", function(){ setView("habits"); });
  document.getElementById("tabGym").addEventListener("click", function(){ setView("gym"); });
  document.getElementById("tabTasks").addEventListener("click", function(){ setView("tasks"); });
  document.getElementById("tabFree").addEventListener("click", function(){ setView("free"); });
  document.getElementById("addBtn").addEventListener("click", function(){
    if(view==="gym") openGymEditor(today());
    else if(view==="tasks") openSheet("task");
    else if(view==="free") openSheet("free");
    else openSheet("habit");
  });
  function render(){ renderHero(); if(view==="habits") renderHabits(); else if(view==="gym") renderGym(); else if(view==="tasks") renderTasks(); else renderFree(); }

  // ================= notifications (best-effort; only fires while the app is open) =================
  var notifyAsked=false;
  function notifySupported(){ return typeof window!=="undefined" && "Notification" in window; }
  function askNotifyPermission(){
    if(notifyAsked || !notifySupported()) return;
    notifyAsked=true;
    try{ if(Notification.permission==="default") Notification.requestPermission(); }catch(e){}
  }
  function notify(title,body){
    try{
      if(!notifySupported() || Notification.permission!=="granted") return;
      new Notification(title, { body:body, icon:"data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192'><rect width='192' height='192' rx='42' fill='%2316211F'/><path d='M96 36c11 24 41 35 41 70a41 41 0 0 1-82 0c0-13 6-22 12-29 2 11 4 20 2 27 10-5 16-11 19-20 2 11-1 29 8 -48z' fill='%23E8B04B'/></svg>") });
    }catch(e){}
  }
  function checkDueTasksNotify(){
    if(!notifySupported() || Notification.permission!=="granted") return;
    var t=today();
    if(state.settings.notifiedTasksDate===t) return;
    var dueToday=state.tasks.filter(function(x){ return !x.done && x.due===t; }).length;
    var overdue=state.tasks.filter(function(x){ return !x.done && x.due && x.due<t; }).length;
    if(dueToday+overdue===0) return;
    var parts=[]; if(dueToday) parts.push(dueToday+" due today"); if(overdue) parts.push(overdue+" overdue");
    notify("Ember", parts.join(", ")+".");
    state.settings.notifiedTasksDate=t; save();
  }

  // ================= misc =================
  var toastEl=document.getElementById("toast"), toastT=null;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove("show"); },2100); }
  var curDay=today();
  (function(){ document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); })();
  setInterval(function(){ if(view==="free") tickFree(); var t=today(); if(t!==curDay){ curDay=t; render(); checkDueTasksNotify(); } },1000);
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) save(); else checkDueTasksNotify(); });

  document.getElementById("installHint").addEventListener("click", function(){
    var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    alert(iOS?"On iPhone (Safari):\n\n1. Tap the Share button.\n2. Scroll to \"Add to Home Screen\".\n3. Tap Add.":"On Android (Chrome):\n\n1. Tap the ⋮ menu (top-right).\n2. Tap \"Add to Home screen\".\n3. Confirm.");
  });

  try{
    var icon="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' rx='112' fill='#16211F'/><path d='M256 96c30 64 108 94 108 188a108 108 0 0 1-216 0c0-36 15-60 32-79 6 30 10 54 6 71 26-12 43-28 51-52 4 30-4 78 19 0z' fill='#E8B04B'/></svg>");
    var manifest={ name:"Ember", short_name:"Ember", display:"standalone", background_color:"#16211F", theme_color:"#16211F", icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}] };
    var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"})); document.head.appendChild(link);
    var apple=document.createElement("link"); apple.rel="apple-touch-icon"; apple.href=icon; document.head.appendChild(apple);
  }catch(e){}

  render();
  checkDueTasksNotify();
})();
</script>
</body>
</html>
